<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الفريق — DotForLife</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<style>
  :root{--green:#054241;--teal:#6abfb8;--orange:#fd781c;--cream:#FAF8F4;--bg:#eef3f1;--line:#dfe6e3;--muted:#6b7a76}
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Almarai',sans-serif}
  body{background:var(--bg);color:var(--green);min-height:100vh}
  #gate{position:fixed;inset:0;background:linear-gradient(160deg,#054241,#0a6b63);display:flex;align-items:center;justify-content:center;z-index:50}
  #gate .box{background:#fff;border-radius:18px;padding:2.2rem;width:min(360px,90vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3)}
  #gate h1{font-size:1.2rem;margin-bottom:.4rem}#gate p{font-size:.8rem;color:var(--muted);margin-bottom:1.2rem}
  #gate input{width:100%;padding:.8rem 1rem;border:1.5px solid var(--line);border-radius:10px;font-size:1rem;text-align:center;margin-bottom:.8rem}
  #gate button{width:100%;padding:.8rem;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:1rem;font-weight:700;cursor:pointer}
  #gate .err{color:#c0392b;font-size:.82rem;min-height:1.1em}
  #app{display:none}
  .layout{display:flex;min-height:100vh}
  .side{width:240px;flex:0 0 240px;background:#fff;border-left:1px solid var(--line);padding:1rem .7rem}
  .side .brand{font-size:1.1rem;font-weight:800;padding:.4rem .6rem 1rem}
  .side .brand .dot{color:var(--teal)}
  .side button{display:flex;align-items:center;gap:.5rem;width:100%;text-align:right;background:transparent;border:0;border-radius:10px;padding:.7rem .8rem;font-size:.9rem;font-weight:700;color:var(--green);cursor:pointer;margin-bottom:.25rem}
  .side button:hover{background:var(--cream)}
  .side button.active{background:var(--green);color:#fff}
  .side .lock{margin-top:1rem;color:var(--muted);font-weight:400;font-size:.8rem}
  .main{flex:1;padding:1.2rem clamp(1rem,3vw,2rem);overflow-x:auto}
  .traction{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:1rem}
  .metric{background:#fff;border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem}
  .metric .v{font-size:1.4rem;font-weight:800}.metric .l{font-size:.72rem;color:var(--muted)}
  .roster{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1.2rem}
  .chip{display:inline-flex;align-items:center;gap:.35rem;background:#fff;border:1px solid var(--line);border-radius:999px;padding:.3rem .7rem;font-size:.76rem;font-weight:700}
  .chip .dotc{width:9px;height:9px;border-radius:50%}
  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  @media(max-width:980px){.board{grid-template-columns:1fr 1fr}.side{width:180px;flex-basis:180px}}
  @media(max-width:640px){.board{grid-template-columns:1fr}.layout{flex-direction:column}.side{width:100%;flex-basis:auto;border-left:0;border-bottom:1px solid var(--line)}}
  .col{background:#e4ebe8;border-radius:14px;padding:.6rem;min-height:120px}
  .col h2{font-size:.85rem;font-weight:800;padding:.3rem .4rem .6rem;display:flex;justify-content:space-between}
  .col h2 .count{background:#cfdbd6;border-radius:999px;padding:0 .5rem;font-size:.72rem}
  .col.drag{outline:2px dashed var(--teal);outline-offset:-3px}
  .card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:.7rem .8rem;margin-bottom:.5rem;cursor:grab;box-shadow:0 1px 2px rgba(5,66,65,.04)}
  .card .t{font-size:.84rem;font-weight:700;line-height:1.5}
  .card .meta{display:flex;align-items:center;justify-content:space-between;margin-top:.5rem}
  .badge{font-size:.7rem;font-weight:700;color:#fff;border-radius:999px;padding:.12rem .55rem}
  .sect{font-size:.68rem;color:var(--muted);background:var(--cream);border:1px solid var(--line);border-radius:6px;padding:.1rem .45rem}
  .rlink{display:inline-flex;align-items:center;gap:.3rem;margin-top:.55rem;font-size:.76rem;font-weight:700;color:#fff;background:var(--orange);border-radius:8px;padding:.35rem .75rem;text-decoration:none}
  .order{margin-top:.55rem;font-size:.74rem}.order summary{cursor:pointer;color:var(--green);font-weight:700}
  .order .ob{margin-top:.35rem;color:#444;line-height:1.6;white-space:pre-wrap;background:var(--cream);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem}
  .result{margin-top:.55rem;font-size:.74rem;color:#1f7a4d;background:#eafaf0;border:1px solid #bfe8cf;border-radius:8px;padding:.45rem .6rem;white-space:pre-wrap}
  .addbtn{width:100%;background:transparent;border:1.5px dashed #c2d0cb;color:var(--muted);border-radius:9px;padding:.5rem;font-size:.78rem;cursor:pointer;font-weight:700}
  .doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.4rem clamp(1rem,3vw,2rem);line-height:1.8;max-width:1100px}
  .doc h1{font-size:1.5rem;margin:.2rem 0 1rem;color:var(--green)}
  .doc h2{font-size:1.15rem;margin:1.4rem 0 .6rem;color:var(--green)}
  .doc table{width:100%;border-collapse:collapse;margin:.8rem 0;font-size:.82rem}
  .doc th,.doc td{border:1px solid var(--line);padding:.5rem .6rem;text-align:right}
  .doc th{background:var(--cream)}
  .doc a{color:var(--orange);font-weight:700}
  .doc blockquote{background:var(--cream);border-right:3px solid var(--teal);padding:.6rem 1rem;margin:.8rem 0;border-radius:8px;color:var(--muted)}
  .doc code{background:var(--cream);padding:.1rem .35rem;border-radius:5px;font-size:.85em}
  .docnote{font-size:.74rem;color:var(--muted);margin-top:.8rem}
  .vgnav{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:1rem}
  .vgnav button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:.4rem .8rem;font-size:.76rem;font-weight:700;color:var(--green);cursor:pointer}
  .vgnav button:hover{background:var(--cream)}
  .vgnav button.on{background:var(--green);color:#fff;border-color:var(--green)}
  .vgnav .grp{align-self:center;font-size:.72rem;color:var(--muted);font-weight:700;margin:0 .2rem}
</style>
</head>
<body>
<div id="gate"><div class="box"><h1>🔒 لوحة الفريق</h1><p>دوت فور لايف — للمصرّح لهم فقط</p>
<input id="pw" type="password" placeholder="كلمة المرور" autocomplete="off" autofocus>
<div class="err" id="err"></div><button id="enter">دخول</button></div></div>

<div id="app"><div class="layout">
  <nav class="side">
    <div class="brand">DOT<span class="dot">.</span>FORLIFE</div>
    <button data-s="content" class="active">📋 إدارة المحتوى</button>
    <button data-s="visual">🎨 الحوكمة البصرية</button>
    <button data-s="development">🔬 التطوير</button>
    <button data-s="ideas">💡 طرح الأفكار</button>
    <button data-s="growth">📈 النمو</button>
    <button data-s="social">📱 السوشيال ميديا</button>
    <button data-s="youtube">🎬 يوتيوب</button>
    <button data-s="ideogram">🖼️ إيديوجرام</button>
    <button class="lock" id="lock">🔓 قفل وخروج</button>
  </nav>
  <main class="main">
    <div id="view-content"><div class="traction" id="traction"></div><div class="roster" id="roster"></div><div class="board" id="board"></div></div>
    <div id="view-doc" style="display:none"><div class="doc" id="doc"></div><div class="docnote">يحدّثه الفريق عبر الملف في <code>system/sections/</code> ويظهر هنا بعد git push.</div></div>
    <div id="view-vg" style="display:none"><div class="vgnav" id="vgnav"></div><div class="doc" id="vgdoc"></div><div class="docnote">المرجعية البصرية العليا — المصدر في <code>visual-governance/</code>. أي صورة أو فيديو يمرّ ببوابة الامتثال قبل النشر.</div></div>
  </main>
</div></div>

<script>
const PW_HASH="fa9899abdc529955d8680983a61da3cb53473580959787592e1e1a69f2575d2b";
const $=s=>document.querySelector(s);
const SECTIONS={development:'sections/development.md',ideas:'sections/ideas.md',growth:'sections/growth.md',social:'sections/social.md',youtube:'sections/youtube.md',ideogram:'sections/ideogram.md'};
const VGB='../visual-governance/';
const VG=[
 {g:'الرئيسي'},
 {k:'الميثاق الحاكم',f:'00-master-charter.md'},
 {k:'قالب علامة جديدة',f:'future-brand-template.md'},
 {g:'D4L'},
 {k:'الفلسفة',f:'d4l/01-visual-philosophy.md'},
 {k:'الألوان',f:'d4l/02-color-system.md'},
 {k:'التصوير',f:'d4l/03-photography-direction.md'},
 {k:'الإضاءة',f:'d4l/04-lighting-system.md'},
 {k:'تمثيل الإنسان',f:'d4l/05-human-representation.md'},
 {k:'الاحتشام',f:'d4l/06-islamic-modesty.md'},
 {k:'الثَمبنيل',f:'d4l/07-thumbnail-system.md'},
 {k:'الاتجاه العاطفي',f:'d4l/08-emotional-direction.md'},
 {g:'العلامات'},
 {k:'Graphics House',f:'graphics-house/visual-system.md'},
 {k:'Human & Architecture',f:'human-architecture/visual-system.md'},
 {g:'الأدوات'},
 {k:'مكتبة البرومبتات',f:'prompt-library.md'},
 {k:'الإجراءات SOPs',f:'sops.md'},
 {k:'الامتثال',f:'compliance.md'},
 {k:'سير العمل',f:'workflow-integration.md'},
 {k:'التنفيذ بالمنصة',f:'platform-implementation.md'},
 {k:'قاعدة المعرفة',f:'knowledge-base.md'},
 {g:'القياس والتطوّر'},
 {k:'📊 لوحة الصحة (حيّة)',live:true},
 {k:'إطار المؤشرات KPI',f:'intelligence/01-kpi-framework.md'},
 {k:'محرّك تنقيط الجودة',f:'intelligence/02-quality-scoring-engine.md'},
 {k:'لوحات حسب الدور',f:'intelligence/03-health-dashboards.md'},
 {k:'التطوّر والإصدارات',f:'intelligence/04-evolution-versioning.md'},
 {k:'حلقة التعلّم',f:'intelligence/05-learning-loop.md'},
 {k:'التدريب والتبنّي',f:'intelligence/06-training-adoption.md'},
 {k:'الإنذار وكشف المخاطر',f:'intelligence/07-alert-risk-detection.md'},
 {k:'التوسّع والمرونة',f:'intelligence/08-scalability-expansion.md'},
];
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function tryEnter(){const h=await sha256($('#pw').value);if(h===PW_HASH){sessionStorage.setItem('dfl_board_ok','1');show()}else $('#err').textContent='كلمة المرور غير صحيحة'}
$('#enter').onclick=tryEnter;$('#pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryEnter()});
$('#lock').onclick=()=>{sessionStorage.removeItem('dfl_board_ok');location.reload()};
function show(){$('#gate').style.display='none';$('#app').style.display='block';loadBoard()}
if(sessionStorage.getItem('dfl_board_ok')==='1')show();

document.querySelectorAll('.side button[data-s]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.side button[data-s]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');const s=b.dataset.s;
  $('#view-content').style.display='none';$('#view-doc').style.display='none';$('#view-vg').style.display='none';
  if(s==='content'){$('#view-content').style.display=''}
  else if(s==='visual'){$('#view-vg').style.display='';renderVG()}
  else{$('#view-doc').style.display='';loadDoc(SECTIONS[s])}
});
async function loadDoc(file){$('#doc').innerHTML='جارٍ التحميل…';try{const t=await (await fetch(file+'?_='+Date.now())).text();$('#doc').innerHTML=marked.parse(t)}catch(e){$('#doc').innerHTML='تعذّر تحميل الملف.'}}
let vgInit=false;
function renderVG(){if(vgInit)return;vgInit=true;
  $('#vgnav').innerHTML=VG.map((x,i)=>x.g?`<span class="grp">${x.g}</span>`:`<button data-i="${i}">${x.k}</button>`).join('');
  document.querySelectorAll('#vgnav button').forEach(btn=>btn.onclick=()=>{
    document.querySelectorAll('#vgnav button').forEach(z=>z.classList.remove('on'));btn.classList.add('on');
    const it=VG[btn.dataset.i];if(it.live){renderHealth()}else{loadVG(it.f)}});
  const first=$('#vgnav button');if(first){first.classList.add('on');loadVG(VG.find(x=>x.f).f)}}
async function loadVG(file){$('#vgdoc').innerHTML='جارٍ التحميل…';try{const t=await (await fetch(VGB+file+'?_='+Date.now())).text();$('#vgdoc').innerHTML=marked.parse(t)}catch(e){$('#vgdoc').innerHTML='تعذّر تحميل الوثيقة.'}}
function kpiColor(k){if(k.value==null)return '#9aa7a3';const v=k.value,t=k.target,w=k.warn;
  if(k.invert){if(v<=t)return '#1f9d57';if(v<=w)return '#e0a400';return '#c0392b'}
  if(v>=t)return '#1f9d57';if(v>=w)return '#e0a400';return '#c0392b'}
async function renderHealth(){$('#vgdoc').innerHTML='جارٍ تحميل لوحة الصحة…';
  try{const m=await (await fetch('governance-metrics.json?_='+Date.now())).json();
    const cards=m.kpis.map(k=>{const c=kpiColor(k);const val=k.value==null?'—':k.value+(k.unit||'');
      const tgt=(k.invert?'≤ ':'≥ ')+k.target+(k.unit||'');
      return `<div class="metric" style="border-right:4px solid ${c}"><div class="v" style="color:${c}">${val}</div><div class="l">${k.label}</div><div class="l" style="margin-top:.2rem">الهدف: ${tgt}</div></div>`}).join('');
    const al=(m.alerts&&m.alerts.length)?m.alerts.map(a=>`<li>${a.severity||''} — ${a.msg||a}</li>`).join(''):'<li>لا إنذارات نشطة ✅</li>';
    const sw=m.scoring_weights||{};
    $('#vgdoc').innerHTML=`<h1>📊 لوحة صحة الحوكمة</h1>
      <div class="docnote" style="margin:0 0 1rem">آخر تحديث: ${m.updated||'—'} · المصدر: <code>system/governance-metrics.json</code> (يملؤه المدير البصري). «—» = بانتظار البيانات.</div>
      <div class="traction">${cards}</div>
      <h2>الإنذارات النشطة</h2><ul>${al}</ul>
      <h2>أوزان التنقيط</h2><p>العلامة ${sw.brand}% · الاحتشام ${sw.modesty}% · العاطفي ${sw.emotional}% · التقني ${sw.technical}% · برومبت AI ${sw.ai_prompt}% — عتبة النجاح ${sw.pass_threshold}/100، حدّ الاحتشام ${sw.modesty_min}.</p>
      <div class="docnote">تُحدَّث الأرقام تلقائياً عند تعديل ملف البيانات و git push.</div>`;
  }catch(e){$('#vgdoc').innerHTML='تعذّر تحميل لوحة الصحة (governance-metrics.json).'}}

let DATA=null,MEMBERS={};const LS='dfl_board_overrides';
const ov=()=>JSON.parse(localStorage.getItem(LS)||'{}');
const saveOv=(id,c)=>{const o=ov();o[id]=c;localStorage.setItem(LS,JSON.stringify(o))};
async function loadBoard(){try{DATA=await (await fetch('tasks.json?_='+Date.now())).json()}catch(e){$('#board').innerHTML='تعذّر تحميل tasks.json';return}MEMBERS=DATA.members||{};rT();rR();rB()}
function rT(){$('#traction').innerHTML=Object.entries(DATA.traction||{}).map(([l,v])=>`<div class="metric"><div class="v">${v}</div><div class="l">${l}</div></div>`).join('')}
function rR(){$('#roster').innerHTML=Object.entries(MEMBERS).map(([n,c])=>`<span class="chip"><span class="dotc" style="background:${c}"></span>${n}</span>`).join('')}
function rB(){const o=ov();const cards=(DATA.cards||[]).map(c=>({...c,col:o[c.id]||c.col}));
  $('#board').innerHTML=DATA.columns.map(col=>{const list=cards.filter(c=>c.col===col.id);
    return `<div class="col" data-col="${col.id}"><h2>${col.title}<span class="count">${list.length}</span></h2>${list.map(cardHTML).join('')}<button class="addbtn" data-col="${col.id}">+ إضافة بطاقة</button></div>`}).join('');wire()}
function cardHTML(c){const color=MEMBERS[c.assignee]||'#054241';const esc=x=>(x||'').replace(/</g,'&lt;');
  const link=c.link?`<a class="rlink" href="${c.link}" target="_blank" rel="noopener">🔗 افتح للمراجعة</a>`:'';
  const order=c.order?`<details class="order"><summary>📋 الأمر (من ${esc(c.from)||'عامر'})</summary><div class="ob">${esc(c.order)}</div></details>`:'';
  const result=c.result?`<div class="result">✅ رد التنفيذ: ${esc(c.result)}</div>`:'';
  return `<div class="card" draggable="true" data-id="${c.id}"><div class="t">${c.title}</div><div class="meta"><span class="badge" style="background:${color}">${c.assignee||'—'}</span><span class="sect">${c.section||''}</span></div>${order}${result}${link}</div>`}
function wire(){let d=null;
  document.querySelectorAll('.card').forEach(el=>{el.addEventListener('dragstart',()=>{d=el.dataset.id;el.style.opacity=.5});el.addEventListener('dragend',()=>el.style.opacity=1)});
  document.querySelectorAll('.col').forEach(col=>{col.addEventListener('dragover',e=>{e.preventDefault();col.classList.add('drag')});col.addEventListener('dragleave',()=>col.classList.remove('drag'));col.addEventListener('drop',e=>{e.preventDefault();col.classList.remove('drag');if(d){saveOv(d,col.dataset.col);rB()}})});
  document.querySelectorAll('.addbtn').forEach(b=>b.onclick=()=>{const t=prompt('عنوان المهمة:');if(!t)return;const a=prompt('المسؤول:','رواق')||'';const id='local-'+Date.now();DATA.cards.push({id,title:t,assignee:a,section:'',col:b.dataset.col});rB()})}
</script>
</body>
</html>
