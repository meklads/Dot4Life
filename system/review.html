<head>
<meta charset="UTF-8">

<title>المخرجات — دوت فور لايف</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<style>
  :root {
    --green:#054241; --teal:#6abfb8; --orange:#fd781c;
    --cream:#FAF8F4; --bg:#f5f6fa; --card:#fff; --line:#dfe6e3; --muted:#6b7a76;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Almarai','Segoe UI',sans-serif;
    background:var(--bg);color:#222;line-height:1.8;
    padding:30px 16px
  }
  .container{max-width:1100px;margin:0 auto}

  /* HEADER */
  .header{
    background:linear-gradient(135deg,var(--green),#0a6b63);
    color:#fff;padding:28px 32px;border-radius:var(--radius);
    margin-bottom:28px;text-align:center
  }
  .header h1{font-size:24px;margin-bottom:4px}
  .header .sub{font-size:13px;opacity:.85}
  .header .date{
    display:inline-block;
    background:rgba(255,255,255,.15);
    padding:4px 18px;border-radius:20px;
    font-size:13px;margin-top:8px
  }

  /* MEMBER SECTION */
  .member{
    background:var(--card);
    border-radius:var(--radius);
    margin-bottom:18px;
    overflow:hidden;
    box-shadow:0 1px 4px rgba(5,66,65,.06)
  }
  .member-head{
    padding:16px 22px;
    display:flex;align-items:center;gap:12px;
    cursor:pointer;
    border-bottom:1px solid var(--line)
  }
  .member-head .avatar{
    width:42px;height:42px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;flex-shrink:0
  }
  .member-head .info{flex:1}
  .member-head .info .name{font-size:16px;font-weight:800;color:var(--green)}
  .member-head .info .role{font-size:11px;color:var(--muted)}
  .member-head .status-badge{
    font-size:11px;padding:3px 12px;border-radius:999px;font-weight:700
  }
  .status-badge.green{background:#e8f5e9;color:#2e7d32}
  .status-badge.yellow{background:#fff3e0;color:#e65100}
  .status-badge.gray{background:#eceff1;color:#78909c}
  .member-head .toggle{font-size:18px;color:#bbb;transition:.2s}
  .member-head .toggle.open{transform:rotate(180deg)}

  .member-body{padding:14px 22px 18px}

  /* DELIVERABLE ITEM */
  .deliverable{
    background:#fafbfc;
    border:1px solid #eef0f2;
    border-radius:12px;
    padding:12px 16px;
    margin-bottom:10px;
    transition:.15s
  }
  .deliverable:hover{border-color:var(--teal);background:#f7fafa}
  .deliverable:last-child{margin-bottom:0}

  .deliv-head{
    display:flex;align-items:flex-start;gap:10px
  }
  .deliv-icon{font-size:18px;line-height:1.4;flex-shrink:0}
  .deliv-content{flex:1;min-width:0}
  .deliv-title{
    font-size:14px;font-weight:700;color:var(--green);
    margin-bottom:2px
  }
  .deliv-desc{
    font-size:12px;color:var(--muted);
    margin-bottom:4px
  }
  .deliv-link{
    display:inline-block;
    font-size:12px;color:var(--teal);text-decoration:none;
    font-weight:600;margin-left:12px
  }
  .deliv-link:hover{text-decoration:underline}
  .deliv-status{
    display:inline-block;
    font-size:10px;padding:1px 8px;border-radius:999px;font-weight:700
  }
  .deliv-status.done{background:#e8f5e9;color:#2e7d32}
  .deliv-status.pending{background:#fff3e0;color:#e65100}
  .deliv-status.waiting{background:#e3f2fd;color:#1565c0}
  .deliv-status.review{background:#f3e5f5;color:#7b1fa2}

  .empty-state{
    text-align:center;padding:24px;color:#bbb;font-size:13px
  }

  /* FILTER BAR */
  .filter-bar{
    display:flex;flex-wrap:wrap;gap:8px;
    margin-bottom:20px
  }
  .filter-btn{
    padding:6px 16px;border-radius:999px;border:1.5px solid var(--line);
    background:var(--card);color:var(--muted);font-size:12px;font-weight:700;
    cursor:pointer;transition:.15s
  }
  .filter-btn:hover{border-color:var(--teal);color:var(--green)}
  .filter-btn.active{background:var(--green);color:#fff;border-color:var(--green)}

  /* SUMMARY ROW */
  .summary{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
    gap:10px;margin-bottom:24px
  }
  .stat-box{
    background:var(--card);
    border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;text-align:center
  }
  .stat-box .num{font-size:22px;font-weight:800;color:var(--green)}
  .stat-box .lab{font-size:11px;color:var(--muted)}

  .footer{
    text-align:center;color:#aaa;font-size:12px;
    margin-top:40px;padding-top:16px;border-top:1px solid #eee
  }
</style>

// ─── RENDER ──────────────────────────────────────────────
function render(filter){
  const container = document.getElementById('membersContainer');
  const summary = document.getElementById('summaryStats');
  let totalDone=0, totalAll=0;

  let html='';
  TEAM.forEach(m=>{
    const items = filter
      ? m.deliverables.filter(d=>d.status===filter)
      : m.deliverables;
    totalAll += m.deliverables.length;
    totalDone += m.deliverables.filter(d=>d.status==='done').length;

    if(!items.length) return; // skip if empty after filter

    html += `<div class="member">
      <div class="member-head" onclick="this.nextElementSibling.style.display=
        this.nextElementSibling.style.display==='none'?'block':'none';
        this.querySelector('.toggle').classList.toggle('open')">
        <div class="avatar" style="background:${m.color}">${m.emoji}</div>
        <div class="info">
          <div class="name">${m.name}</div>
          <div class="role">${m.role}</div>
        </div>
        <span class="status-badge ${m.status}">${m.status==='green'?'🟢 نشط':'🟡 قيد العمل'}</span>
        <span class="toggle open">▼</span>
      </div>
      <div class="member-body">`;

    items.forEach(d=>{
      const statusMap={done:'✅ منجز',pending:'⏳ قيد العمل',waiting:'🔄 ينتظر',review:'🔍 بانتظار المراجعة'};
      html += `<div class="deliverable">
        <div class="deliv-head">
          <span class="deliv-icon">${d.icon}</span>
          <div class="deliv-content">
            <div class="deliv-title">${d.title}</div>
            ${d.desc?`<div class="deliv-desc">${d.desc}</div>`:''}
            <div style="margin-top:4px">
              ${d.link?`<a class="deliv-link" href="${d.link}" target="_blank">🔗 الرابط ←</a>`:''}
              <span class="deliv-status ${d.status}">${statusMap[d.status]||d.status}</span>
            </div>
          </div>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html || '<div class="empty-state">لا توجد مخرجات في هذا التصنيف</div>';

  // summary
  const pct = totalAll ? Math.round(totalDone/totalAll*100) : 0;
  summary.innerHTML = `
    <div class="stat-box"><div class="num">${TEAM.length}</div><div class="lab">الأعضاء</div></div>
    <div class="stat-box"><div class="num">${totalAll}</div><div class="lab">إجمالي المخرجات</div></div>
    <div class="stat-box"><div class="num">${totalDone}</div><div class="lab">منجز</div></div>
    <div class="stat-box"><div class="num">${totalAll-totalDone}</div><div class="lab">قيد العمل</div></div>
    <div class="stat-box"><div class="num">${pct}%</div><div class="lab">الإنجاز</div></div>
  `;
}

// ─── FILTER BAR ──────────────────────────────────────────
function setupFilter(){
  const bar = document.getElementById('filterBar');
  bar.innerHTML = `
    <button class="filter-btn active" data-filter="">الكل</button>
    <button class="filter-btn" data-filter="done">✅ منجز</button>
    <button class="filter-btn" data-filter="pending">⏳ قيد العمل</button>
    <button class="filter-btn" data-filter="waiting">🔄 ينتظر</button>
    <button class="filter-btn" data-filter="review">🔍 للمراجعة</button>
  `;
  bar.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.onclick=()=>{
      bar.querySelector('.active').classList.remove('active');
      btn.classList.add('active');
      render(btn.dataset.filter);
    };
  });
}

// ─── DATE ────────────────────────────────────────────────
function setDate(){
  const d=new Date();
  const days=['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
  const months=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
  document.getElementById('todayDate').textContent=
    `${days[d.getDay()]}، ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}

setDate();
setupFilter();
render('');
