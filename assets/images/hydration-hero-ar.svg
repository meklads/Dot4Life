<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Water glass with lemon and mint">
  <defs>
    <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#223634"/>
      <stop offset="55%" stop-color="#2d4540"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
    <linearGradient id="h-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="100%" stop-color="#99cc66" stop-opacity=".12"/>
    </linearGradient>
    <linearGradient id="h-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#28bca9" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#054241" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#h-bg)"/>
  <circle cx="980" cy="80" r="120" fill="#e4a31e" opacity=".06"/>
  <circle cx="180" cy="340" r="90" fill="#99cc66" opacity=".05"/>
  <!-- Table surface -->
  <ellipse cx="600" cy="330" rx="320" ry="28" fill="#000" opacity=".18"/>
  <!-- Bottle -->
  <rect x="690" y="120" width="56" height="170" rx="14" fill="#ffffff" opacity=".12"/>
  <rect x="698" y="128" width="40" height="130" rx="10" fill="url(#h-water)" opacity=".85"/>
  <rect x="708" y="108" width="20" height="18" rx="4" fill="#ffffff" opacity=".25"/>
  <!-- Glass -->
  <path d="M520 130 L560 130 L572 290 L508 290 Z" fill="url(#h-glass)"/>
  <path d="M528 155 L552 155 L560 265 L520 265 Z" fill="url(#h-water)"/>
  <!-- Lemon slice -->
  <circle cx="590" cy="250" r="22" fill="#e4a31e" opacity=".75"/>
  <circle cx="590" cy="250" r="14" fill="#e7ae27" opacity=".5"/>
  <path d="M590 236 L590 264 M576 250 L604 250" stroke="#fff" stroke-width="2" opacity=".35"/>
  <!-- Mint leaves -->
  <ellipse cx="545" cy="118" rx="18" ry="10" fill="#597931" opacity=".7" transform="rotate(-25 545 118)"/>
  <ellipse cx="565" cy="112" rx="16" ry="9" fill="#99cc66" opacity=".65" transform="rotate(15 565 112)"/>
  <!-- Soft highlights -->
  <path d="M250 180 Q320 140 390 180" fill="none" stroke="#99cc66" stroke-width="2" opacity=".15"/>
  <path d="M820 200 Q890 160 960 200" fill="none" stroke="#e4a31e" stroke-width="2" opacity=".12"/>
</svg>
