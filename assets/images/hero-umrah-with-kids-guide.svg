      <stop offset="40%" style="stop-color:#0a6b66"/>
      <stop offset="100%" style="stop-color:#2d6b50"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Kaaba silhouette -->
  <rect x="540" y="260" width="120" height="140" rx="4" fill="#6abfb8" opacity=".12"/>
