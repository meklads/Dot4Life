  <circle cx="600" cy="60" r="3" fill="#6abfb8" opacity=".15"/>
  <circle cx="350" cy="120" r="2" fill="#6abfb8" opacity=".25"/>
  <path d="M480 490 Q520 470 560 485" fill="none" stroke="#6abfb8" stroke-width="1.5" opacity=".15"/>
  <path d="M640 490 Q680 470 720 485" fill="none" stroke="#6abfb8" stroke-width="1.5" opacity=".15"/>
