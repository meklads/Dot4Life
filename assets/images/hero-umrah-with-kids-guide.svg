<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="uk-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054241"/>
      <stop offset="55%" stop-color="#0a6b66"/>
      <stop offset="100%" stop-color="#2d6b50"/>
    </linearGradient>
    <radialGradient id="uk-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#6ABFB8" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#6ABFB8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="uk-warm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FD781C" stop-opacity=".18"/>
      <stop offset="100%" stop-color="#FD781C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#uk-bg)"/>
  <circle cx="600" cy="210" r="170" fill="url(#uk-glow)"/>
  <circle cx="600" cy="230" r="110" fill="url(#uk-warm)"/>

  <!-- Tawaf arcs -->
  <ellipse cx="600" cy="250" rx="150" ry="55" stroke="#6ABFB8" stroke-width="2" stroke-dasharray="8 10" opacity=".35"/>
  <ellipse cx="600" cy="250" rx="195" ry="72" stroke="#6ABFB8" stroke-width="1.5" stroke-dasharray="5 12" opacity=".22"/>

  <!-- Kaaba -->
  <rect x="555" y="185" width="90" height="105" rx="4" fill="#054241" stroke="#6ABFB8" stroke-width="2.5" opacity=".85"/>
  <rect x="555" y="185" width="90" height="105" rx="4" fill="#6ABFB8" opacity=".18"/>
  <rect x="555" y="268" width="90" height="14" fill="#FD781C" opacity=".75"/>
  <rect x="555" y="282" width="90" height="8" fill="#1a1a1a" opacity=".55"/>
  <line x1="600" y1="185" x2="600" y2="290" stroke="#6ABFB8" stroke-width="1.5" opacity=".35"/>

  <!-- Family: parent + child (left) -->
  <g opacity=".9">
    <circle cx="380" cy="210" r="16" fill="#6ABFB8" opacity=".55"/>
    <path d="M362 232 Q380 268 398 232" fill="#6ABFB8" opacity=".35"/>
    <circle cx="358" cy="228" r="9" fill="#FD781C" opacity=".65"/>
    <path d="M350 238 Q358 258 366 238" fill="#FD781C" opacity=".4"/>
    <!-- small suitcase -->
    <rect x="408" y="252" width="22" height="16" rx="3" fill="#6ABFB8" opacity=".45" stroke="#6ABFB8" stroke-width="1.2"/>
    <path d="M414 252 L414 246 Q419 242 424 246 L424 252" stroke="#FD781C" stroke-width="1.5" opacity=".7"/>
  </g>

  <!-- Family: parent (right) -->
  <g opacity=".85">
    <circle cx="820" cy="210" r="16" fill="#6ABFB8" opacity=".55"/>
    <path d="M802 232 Q820 268 838 232" fill="#6ABFB8" opacity=".35"/>
    <!-- stroller hint -->
    <circle cx="770" cy="262" r="7" fill="none" stroke="#6ABFB8" stroke-width="2" opacity=".45"/>
    <circle cx="788" cy="262" r="7" fill="none" stroke="#6ABFB8" stroke-width="2" opacity=".45"/>
    <path d="M762 250 L778 238 L792 250 L792 258" stroke="#FD781C" stroke-width="2" opacity=".55"/>
  </g>

  <!-- Stars -->
  <g fill="#fff" opacity=".55">
    <circle cx="90" cy="55" r="1.5"/><circle cx="1110" cy="70" r="1.2"/><circle cx="220" cy="90" r="1"/>
    <circle cx="980" cy="45" r="1.4"/><circle cx="450" cy="60" r="1"/><circle cx="760" cy="80" r="1.2"/>
  </g>
  <circle cx="1050" cy="55" r="2" fill="#FD781C" opacity=".5"/>
  <circle cx="150" cy="320" r="2" fill="#6ABFB8" opacity=".45"/>
</svg>
