<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="fc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054241" stop-opacity=".08"/>
      <stop offset="50%" stop-color="#fd781c" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#6abfb8" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="fc-flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fd781c" stop-opacity=".7"/>
      <stop offset="40%" stop-color="#faa05a" stop-opacity=".5"/>
      <stop offset="70%" stop-color="#6abfb8" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#6abfb8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#fc-bg)" rx="24"/>
  <!-- Flame body -->
  <path d="M400,420 C400,420 340,320 340,270 C340,230 360,200 400,180 C440,200 460,230 460,270 C460,320 400,420 400,420Z" fill="url(#fc-flame)"/>
  <!-- Inner glow -->
  <path d="M400,390 C400,390 358,310 358,270 C358,242 372,220 400,205 C428,220 442,242 442,270 C442,310 400,390 400,390Z" fill="#fff" opacity=".15"/>
  <!-- Energy rings -->
  <ellipse cx="400" cy="180" rx="60" ry="8" fill="none" stroke="#6abfb8" stroke-width="1.5" opacity=".2"/>
  <ellipse cx="400" cy="160" rx="80" ry="10" fill="none" stroke="#fd781c" stroke-width="1" opacity=".15"/>
  <ellipse cx="400" cy="140" rx="100" ry="12" fill="none" stroke="#6abfb8" stroke-width="1" opacity=".1"/>
  <!-- Small energy particles -->
  <circle cx="340" cy="200" r="3" fill="#fd781c" opacity=".3"/>
  <circle cx="460" cy="210" r="2.5" fill="#fd781c" opacity=".25"/>
  <circle cx="370" cy="150" r="2" fill="#6abfb8" opacity=".2"/>
  <circle cx="430" cy="160" r="2" fill="#6abfb8" opacity=".2"/>
  <circle cx="320" cy="260" r="2" fill="#fd781c" opacity=".2"/>
  <circle cx="480" cy="250" r="1.5" fill="#fd781c" opacity=".15"/>
  <!-- Numerical energy marks -->
  <text x="380" y="360" font-family="sans-serif" font-size="48" fill="#fff" opacity=".25" font-weight="800">⚡</text>
  <circle cx="260" cy="370" r="20" fill="none" stroke="#6abfb8" stroke-width="1" opacity=".12"/>
  <circle cx="540" cy="370" r="20" fill="none" stroke="#6abfb8" stroke-width="1" opacity=".12"/>
  <circle cx="260" cy="370" r="10" fill="#6abfb8" opacity=".08"/>
  <circle cx="540" cy="370" r="10" fill="#6abfb8" opacity=".08"/>
</svg>
