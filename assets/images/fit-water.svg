<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="fw-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054241" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#6abfb8" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="fw-drop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6abfb8" stop-opacity=".6"/>
      <stop offset="100%" stop-color="#054241" stop-opacity=".3"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fw-bg)" rx="20"/>
  <!-- Water drop -->
  <path d="M200,60 C200,60 155,140 155,175 C155,205 175,225 200,225 C225,225 245,205 245,175 C245,140 200,60 200,60Z" fill="url(#fw-drop)" opacity=".7"/>
  <!-- Wave lines inside -->
  <path d="M165,190 Q182,180 200,190 Q218,200 235,190" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".4"/>
  <path d="M168,205 Q185,195 200,205 Q215,215 232,205" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" opacity=".3"/>
  <!-- Small droplets -->
  <circle cx="130" cy="160" r="4" fill="#6abfb8" opacity=".3"/>
  <circle cx="270" cy="180" r="3" fill="#6abfb8" opacity=".25"/>
  <circle cx="140" cy="200" r="2" fill="#6abfb8" opacity=".2"/>
</svg>
