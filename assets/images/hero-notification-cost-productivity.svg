<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#0a6b66"/>
      <stop offset="100%" style="stop-color:#3a7569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Phone with multiple notifications -->
  <rect x="560" y="220" width="80" height="140" rx="8" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".4"/>
  <line x1="570" y1="260" x2="630" y2="260" stroke="#fd781c" stroke-width="4" opacity=".6"/>
  <line x1="570" y1="280" x2="620" y2="280" stroke="#fd781c" stroke-width="4" opacity=".5"/>
  <line x1="570" y1="300" x2="625" y2="300" stroke="#fd781c" stroke-width="4" opacity=".4"/>
  <line x1="570" y1="240" x2="615" y2="240" stroke="#6abfb8" stroke-width="3" opacity=".4"/>
  <!-- Brain / focus -->
  <circle cx="600" cy="430" r="30" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <path d="M590 420 Q600 410 610 420" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="3" fill="#6abfb8" opacity=".3"/>
  <circle cx="1120" cy="520" r="4" fill="#6abfb8" opacity=".25"/>
  <circle cx="200" cy="500" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="1000" cy="100" r="2" fill="#fd781c" opacity=".3"/>
  <circle cx="600" cy="60" r="3" fill="#6abfb8" opacity=".2"/>
  <circle cx="350" cy="120" r="2" fill="#6abfb8" opacity=".3"/>
  <circle cx="850" cy="480" r="2" fill="#fd781c" opacity=".2"/>
</svg>