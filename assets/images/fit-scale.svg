<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="fsc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054241" stop-opacity=".05"/>
      <stop offset="100%" stop-color="#6abfb8" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fsc-bg)" rx="20"/>
  <!-- Measuring tape body -->
  <rect x="120" y="80" width="160" height="20" rx="10" fill="#6abfb8" opacity=".4"/>
  <!-- Tape extending out -->
  <path d="M280,90 Q320,90 340,110 Q360,130 360,160" fill="none" stroke="#054241" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <!-- Tape markings -->
  <line x1="290" y1="87" x2="290" y2="93" stroke="#054241" stroke-width="1.5" opacity=".4"/>
  <line x1="305" y1="87" x2="305" y2="93" stroke="#054241" stroke-width="1.5" opacity=".4"/>
  <line x1="320" y1="87" x2="320" y2="93" stroke="#054241" stroke-width="1.5" opacity=".4"/>
  <!-- Dial on top -->
  <circle cx="200" cy="65" r="18" fill="none" stroke="#054241" stroke-width="2" opacity=".4"/>
  <circle cx="200" cy="65" r="3" fill="#fd781c" opacity=".5"/>
  <line x1="200" y1="65" x2="200" y2="50" stroke="#fd781c" stroke-width="1.5" stroke-linecap="round" opacity=".4"/>
  <!-- Body composition circles -->
  <circle cx="140" cy="180" r="30" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".2"/>
  <circle cx="200" cy="190" r="25" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".15"/>
  <circle cx="260" cy="180" r="28" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".2"/>
  <!-- Percentages -->
  <text x="200" y="245" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#054241" opacity=".3" font-weight="600">BODY COMPOSITION</text>
</svg>
