<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="gg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#1a5c4a"/>
      <stop offset="100%" style="stop-color:#3a7569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#gg1)"/>
  <!-- Gold bar -->
  <rect x="560" y="280" width="80" height="40" rx="4" fill="#fd781c" opacity=".4"/>
  <rect x="560" y="280" width="80" height="40" rx="4" fill="none" stroke="#fd781c" stroke-width="2" opacity=".5"/>
  <line x1="575" y1="295" x2="625" y2="295" stroke="#fd781c" stroke-width="2" opacity=".3"/>
  <!-- House -->
  <polygon points="600,220 540,280 660,280" fill="#6abfb8" opacity=".2"/>
  <rect x="570" y="280" width="60" height="50" fill="#6abfb8" opacity=".15"/>
  <rect x="590" y="295" width="20" height="35" fill="#6abfb8" opacity=".2"/>
  <!-- Scale/balance -->
  <line x1="400" y1="320" x2="800" y2="320" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <line x1="600" y1="320" x2="600" y2="350" stroke="#fd781c" stroke-width="2" opacity=".3"/>
  <!-- Question mark -->
  <text x="600" y="200" font-family="Arial" font-size="40" fill="#fd781c" opacity=".2" text-anchor="middle">?</text>
  <circle cx="500" cy="240" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="700" cy="250" r="2" fill="#6abfb8" opacity=".4"/>
</svg>
