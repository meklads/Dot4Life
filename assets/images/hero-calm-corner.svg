<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="gc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="60%" style="stop-color:#3a7569"/>
      <stop offset="100%" style="stop-color:#6abfb8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#gc1)"/>
  <!-- Window frame -->
  <rect x="540" y="200" width="120" height="150" rx="6" fill="none" stroke="#6abfb8" stroke-width="3" opacity=".5"/>
  <line x1="600" y1="200" x2="600" y2="350" stroke="#6abfb8" stroke-width="2" opacity=".4"/>
  <line x1="540" y1="275" x2="660" y2="275" stroke="#6abfb8" stroke-width="2" opacity=".4"/>
  <!-- Moon/sun through window -->
  <circle cx="580" cy="240" r="20" fill="#fd781c" opacity=".3"/>
  <!-- Bookshelf -->
  <rect x="530" y="360" width="140" height="8" rx="2" fill="#6abfb8" opacity=".4"/>
  <rect x="540" y="370" width="30" height="20" rx="2" fill="#6abfb8" opacity=".3"/>
  <rect x="580" y="375" width="25" height="15" rx="2" fill="#fd781c" opacity=".2"/>
  <rect x="615" y="372" width="20" height="18" rx="2" fill="#6abfb8" opacity=".25"/>
  <!-- Cushion -->
  <ellipse cx="600" cy="410" rx="60" ry="15" fill="#6abfb8" opacity=".2"/>
  <!-- Calm dots -->
  <circle cx="500" cy="220" r="2" fill="#fd781c" opacity=".5"/>
  <circle cx="700" cy="230" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="480" cy="260" r="3" fill="#6abfb8" opacity=".5"/>
  <circle cx="720" cy="250" r="2" fill="#6abfb8" opacity=".4"/>
  <circle cx="530" cy="180" r="2" fill="#fd781c" opacity=".3"/>
</svg>
