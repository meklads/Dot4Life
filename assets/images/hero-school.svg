<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="gs1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#0a6b63"/>
      <stop offset="100%" style="stop-color:#3a9d8e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#gs1)"/>
  <!-- Book icon -->
  <rect x="560" y="220" width="80" height="100" rx="4" fill="#6abfb8" opacity=".3"/>
  <rect x="550" y="230" width="100" height="90" rx="4" fill="none" stroke="#fd781c" stroke-width="2" opacity=".5"/>
  <!-- Lines of text -->
  <line x1="570" y1="260" x2="630" y2="260" stroke="#6abfb8" stroke-width="4" stroke-linecap="round" opacity=".4"/>
  <line x1="570" y1="275" x2="620" y2="275" stroke="#6abfb8" stroke-width="3" stroke-linecap="round" opacity=".3"/>
  <line x1="570" y1="290" x2="610" y2="290" stroke="#6abfb8" stroke-width="3" stroke-linecap="round" opacity=".25"/>
  <!-- Pencil -->
  <line x1="680" y1="340" x2="700" y2="250" stroke="#fd781c" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  <polygon points="700,250 705,245 695,245" fill="#fd781c" opacity=".4"/>
  <!-- Ruler dots -->
  <circle cx="530" cy="240" r="3" fill="#6abfb8" opacity=".4"/>
  <circle cx="530" cy="260" r="3" fill="#6abfb8" opacity=".4"/>
  <circle cx="530" cy="280" r="3" fill="#6abfb8" opacity=".4"/>
  <circle cx="530" cy="300" r="3" fill="#6abfb8" opacity=".4"/>
  <!-- Light rays -->
  <circle cx="600" cy="150" r="3" fill="#fd781c" opacity=".6"/>
  <circle cx="600" cy="140" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="600" cy="160" r="2" fill="#fd781c" opacity=".4"/>
</svg>
