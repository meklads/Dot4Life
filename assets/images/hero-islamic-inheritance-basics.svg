<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#0a6b66"/>
      <stop offset="100%" style="stop-color:#3a7569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Tree / Family branches -->
  <line x1="600" y1="450" x2="600" y2="200" stroke="#6abfb8" stroke-width="3" opacity=".4"/>
  <line x1="600" y1="250" x2="520" y2="200" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <line x1="600" y1="250" x2="680" y2="200" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <line x1="600" y1="300" x2="530" y2="260" stroke="#6abfb8" stroke-width="2" opacity=".25"/>
  <line x1="600" y1="300" x2="670" y2="260" stroke="#6abfb8" stroke-width="2" opacity=".25"/>
  <circle cx="520" cy="200" r="15" fill="#6abfb8" opacity=".3"/>
  <circle cx="680" cy="200" r="15" fill="#6abfb8" opacity=".3"/>
  <circle cx="530" cy="260" r="12" fill="#fd781c" opacity=".25"/>
  <circle cx="670" cy="260" r="12" fill="#fd781c" opacity=".25"/>
  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="3" fill="#6abfb8" opacity=".3"/>
  <circle cx="1120" cy="520" r="4" fill="#6abfb8" opacity=".25"/>
  <circle cx="200" cy="500" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="1000" cy="100" r="2" fill="#fd781c" opacity=".3"/>
  <circle cx="600" cy="60" r="3" fill="#6abfb8" opacity=".2"/>
  <circle cx="350" cy="120" r="2" fill="#6abfb8" opacity=".3"/>
  <circle cx="850" cy="480" r="2" fill="#fd781c" opacity=".2"/>
</svg>