<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#0a6b66"/>
      <stop offset="100%" style="stop-color:#3a7569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Two overlapping figures -->
  <circle cx="550" cy="280" r="50" fill="none" stroke="#6abfb8" stroke-width="3" opacity=".4"/>
  <circle cx="650" cy="280" r="50" fill="none" stroke="#fd781c" stroke-width="3" opacity=".3"/>
  <path d="M500 380 L520 330 L580 330 L560 380 Z" fill="#6abfb8" opacity=".2"/>
  <path d="M620 380 L640 330 L700 330 L680 380 Z" fill="#fd781c" opacity=".2"/>
