<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="sb1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#FAF8F4"/><stop offset="100%" stop-color="#E8F0ED"/></linearGradient>
    <linearGradient id="sb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#054241" stop-opacity=".08"/><stop offset="100%" stop-color="#054241" stop-opacity=".02"/></linearGradient>
  </defs>
  <!-- background -->
  <rect width="1200" height="420" fill="url(#sb1)"/>
  <!-- subtle pattern -->
  <g opacity=".04" fill="#054241">
    <circle cx="100" cy="50" r="30"/><circle cx="300" cy="80" r="20"/><circle cx="550" cy="40" r="25"/><circle cx="800" cy="70" r="18"/><circle cx="1050" cy="50" r="22"/>
    <circle cx="150" cy="380" r="15"/><circle cx="400" cy="400" r="28"/><circle cx="700" cy="380" r="20"/><circle cx="950" cy="400" r="25"/><circle cx="1100" cy="380" r="16"/>
  </g>
  <!-- sun -->
  <circle cx="1050" cy="70" r="40" fill="#FD781C" opacity=".15"/>
  <circle cx="1050" cy="70" r="28" fill="#FD781C" opacity=".3"/>
  <circle cx="1050" cy="70" r="18" fill="#FD781C" opacity=".5"/>
  <!-- floor -->
  <rect x="0" y="370" width="1200" height="50" fill="#054241" opacity=".06" rx="8"/>
  <!-- child 1 - drawing -->
  <g transform="translate(180,200)">
    <circle cx="0" cy="-60" r="22" fill="#054241"/>
    <ellipse cx="0" cy="20" rx="28" ry="35" fill="#6ABFB8" opacity=".7"/>
    <line x1="0" y1="40" x2="-25" y2="85" stroke="#054241" stroke-width="4" stroke-linecap="round" opacity=".15"/>
    <line x1="0" y1="40" x2="25" y2="85" stroke="#054241" stroke-width="4" stroke-linecap="round" opacity=".15"/>
    <!-- drawing paper -->
    <rect x="-40" y="-10" width="80" height="60" rx="4" fill="#fff" stroke="#054241" stroke-width="1.5" stroke-opacity=".1"/>
    <line x1="-25" y1="10" x2="25" y2="10" stroke="#FD781C" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <line x1="-25" y1="20" x2="15" y2="20" stroke="#6ABFB8" stroke-width="2" stroke-linecap="round" opacity=".6"/>
    <line x1="-25" y1="30" x2="10" y2="30" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    <circle cx="-20" cy="0" r="4" fill="#FD781C" opacity=".4"/>
    <circle cx="10" cy="2" r="3" fill="#6ABFB8" opacity=".4"/>
    <circle cx="25" cy="5" r="3.5" fill="#054241" opacity=".3"/>
  </g>
  <!-- child 2 - reading -->
  <g transform="translate(450,210)">
    <circle cx="0" cy="-60" r="20" fill="#054241"/>
    <ellipse cx="0" cy="20" rx="26" ry="32" fill="#FD781C" opacity=".3"/>
    <line x1="0" y1="38" x2="-22" y2="80" stroke="#054241" stroke-width="4" stroke-linecap="round" opacity=".15"/>
    <line x1="0" y1="38" x2="22" y2="80" stroke="#054241" stroke-width="4" stroke-linecap="round" opacity=".15"/>
    <!-- book -->
    <rect x="-30" y="-5" width="60" height="45" rx="3" fill="#fff" stroke="#054241" stroke-width="1.5" stroke-opacity=".15"/>
    <line x1="0" y1="-5" x2="0" y2="40" stroke="#054241" stroke-width="1" stroke-opacity=".1"/>
    <line x1="-18" y1="8" x2="-5" y2="8" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    <line x1="-18" y1="16" x2="-5" y2="16" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    <line x1="-18" y1="24" x2="-5" y2="24" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    <line x1="5" y1="8" x2="18" y2="8" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    <line x1="5" y1="16" x2="18" y2="16" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".4"/>
    <line x1="5" y1="24" x2="18" y2="24" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".4"/>
  </g>
  <!-- child 3 - building blocks -->
  <g transform="translate(720,220)">
    <circle cx="0" cy="-60" r="21" fill="#054241"/>
    <ellipse cx="0" cy="20" rx="27" ry="34" fill="#054241" opacity=".08"/>
    <line x1="0" y1="40" x2="-24" y2="85" stroke="#054241" stroke-width="4" stroke-linecap="round" opacity=".15"/>
    <line x1="0" y1="40" x2="24" y2="85" stroke="#054241" stroke-width="4" stroke-linecap="round" opacity=".15"/>
    <!-- blocks tower -->
    <rect x="-30" y="15" width="60" height="12" rx="3" fill="#6ABFB8" opacity=".6"/>
    <rect x="-20" y="2" width="40" height="12" rx="3" fill="#FD781C" opacity=".4"/>
    <rect x="-12" y="-12" width="24" height="12" rx="3" fill="#054241" opacity=".5"/>
    <circle cx="0" cy="-6" r="3" fill="#fff" opacity=".5"/>
  </g>
  <!-- parent figure -->
  <g transform="translate(970,185)">
    <circle cx="0" cy="-65" r="24" fill="#054241"/>
    <ellipse cx="0" cy="18" rx="32" ry="40" fill="#054241" opacity=".08"/>
    <line x1="0" y1="40" x2="-28" y2="90" stroke="#054241" stroke-width="5" stroke-linecap="round" opacity=".15"/>
    <line x1="0" y1="40" x2="28" y2="90" stroke="#054241" stroke-width="5" stroke-linecap="round" opacity=".15"/>
    <!-- smile -->
    <path d="M-8-56Q0-48 8-56" stroke="#6ABFB8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- decorative items around -->
  <g opacity=".2" fill="#054241">
    <rect x="60" y="350" width="25" height="20" rx="3"/>
    <circle cx="75" cy="345" r="4" fill="#FD781C"/>
    <rect x="1150" y="345" width="20" height="25" rx="3"/>
    <circle cx="1160" cy="340" r="3.5" fill="#6ABFB8"/>
  </g>
  <!-- text: "طفشان"? No, abstract shapes -->
  <text x="600" y="360" text-anchor="middle" font-family="Almarai,sans-serif" font-size="18" fill="#054241" opacity=".08" font-weight="700">صيف بلا شاشات</text>
</svg>
