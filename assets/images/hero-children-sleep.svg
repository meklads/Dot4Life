<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="gh1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#021d1c"/>
      <stop offset="40%" style="stop-color:#054241"/>
      <stop offset="100%" style="stop-color:#1a6b63"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fd781c;stop-opacity:.5"/>
      <stop offset="100%" style="stop-color:#fd781c;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#gh1)"/>
  <!-- Moon glow -->
  <circle cx="600" cy="200" r="100" fill="url(#moon)"/>
  <!-- Crescent moon -->
  <circle cx="600" cy="200" r="45" fill="#fd781c" opacity=".4"/>
  <circle cx="615" cy="190" r="38" fill="#021d1c"/>
  <!-- Stars -->
  <circle cx="520" cy="170" r="2" fill="#6abfb8" opacity=".7"/>
  <circle cx="680" cy="160" r="1.5" fill="#6abfb8" opacity=".6"/>
  <circle cx="550" cy="140" r="1.5" fill="#6abfb8" opacity=".5"/>
  <circle cx="650" cy="130" r="2" fill="#6abfb8" opacity=".4"/>
  <circle cx="580" cy="230" r="1" fill="#6abfb8" opacity=".5"/>
  <circle cx="510" cy="200" r="1" fill="#6abfb8" opacity=".4"/>
  <!-- Bed/mattress -->
  <rect x="540" y="360" width="120" height="60" rx="8" fill="#6abfb8" opacity=".2"/>
  <rect x="545" y="355" width="110" height="10" rx="4" fill="#6abfb8" opacity=".3"/>
  <!-- Pillow -->
  <ellipse cx="570" cy="365" rx="25" ry="10" fill="#6abfb8" opacity=".25"/>
  <!-- ZZZ -->
  <text x="650" y="300" font-family="Arial" font-size="18" fill="#6abfb8" opacity=".3">z</text>
  <text x="670" y="280" font-family="Arial" font-size="22" fill="#6abfb8" opacity=".25">z</text>
  <text x="695" y="255" font-family="Arial" font-size="26" fill="#6abfb8" opacity=".2">z</text>
  <!-- Clock -->
  <circle cx="600" cy="440" r="18" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <line x1="600" y1="440" x2="600" y2="430" stroke="#6abfb8" stroke-width="2" opacity=".4"/>
  <line x1="600" y1="440" x2="610" y2="440" stroke="#6abfb8" stroke-width="2" opacity=".4"/>
</svg>
