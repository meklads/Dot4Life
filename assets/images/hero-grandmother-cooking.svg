<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#0a6b63"/>
      <stop offset="100%" style="stop-color:#6abfb8"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fd781c;stop-opacity:.15"/>
      <stop offset="100%" style="stop-color:#6abfb8;stop-opacity:.1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#g1)"/>
  <rect width="1200" height="600" fill="url(#g2)"/>
  <!-- Warm overlay circle -->
  <circle cx="600" cy="300" r="220" fill="#fd781c" opacity=".08"/>
  <circle cx="600" cy="300" r="150" fill="#fd781c" opacity=".06"/>
  <!-- Pot/pan -->
  <ellipse cx="600" cy="350" rx="120" ry="40" fill="#6abfb8" opacity=".6"/>
  <ellipse cx="600" cy="340" rx="100" ry="30" fill="#054241"/>
  <ellipse cx="600" cy="340" rx="100" ry="30" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".5"/>
  <!-- Steam wisps -->
  <path d="M580 320 Q570 280 580 250" stroke="#6abfb8" stroke-width="3" fill="none" opacity=".4"/>
  <path d="M600 315 Q595 270 605 240" stroke="#fd781c" stroke-width="3" fill="none" opacity=".3"/>
  <path d="M620 320 Q625 285 615 255" stroke="#6abfb8" stroke-width="3" fill="none" opacity=".4"/>
  <!-- Small hands silhouette (grandmother + grandchildren) -->
  <circle cx="530" cy="280" r="25" fill="#6abfb8" opacity=".3"/>
  <circle cx="670" cy="280" r="20" fill="#6abfb8" opacity=".25"/>
  <circle cx="600" cy="260" r="28" fill="#6abfb8" opacity=".35"/>
  <!-- Decorative dots -->
  <circle cx="480" cy="220" r="4" fill="#fd781c" opacity=".5"/>
  <circle cx="720" cy="220" r="3" fill="#fd781c" opacity=".4"/>
  <circle cx="450" cy="260" r="2" fill="#6abfb8" opacity=".6"/>
  <circle cx="750" cy="260" r="2" fill="#6abfb8" opacity=".5"/>
</svg>
