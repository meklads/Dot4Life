<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054241"/>
      <stop offset="50%" stop-color="#0a6b66"/>
      <stop offset="100%" stop-color="#054241"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6abfb8" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#6abfb8" stop-opacity=".05"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="150" cy="350" r="320" fill="url(#g1)"/>
  <circle cx="1050" cy="80" r="200" fill="url(#g1)"/>
  <!-- Workbench -->
  <rect x="350" y="300" width="500" height="40" rx="4" fill="#1a3a38"/>
  <rect x="360" y="290" width="480" height="10" rx="2" fill="#2a5a58"/>
  <!-- Wood pieces on bench -->
  <rect x="380" y="270" width="80" height="20" rx="2" fill="#c4956a" transform="rotate(-5 420 280)"/>
  <rect x="480" y="275" width="60" height="15" rx="2" fill="#d4a57a" transform="rotate(3 510 282)"/>
  <rect x="560" y="272" width="70" height="18" rx="2" fill="#b8855a" transform="rotate(-2 595 281)"/>
  <!-- Saw -->
  <line x1="660" y1="280" x2="720" y2="260" stroke="#888" stroke-width="3" stroke-linecap="round"/>
  <rect x="710" y="252" width="25" height="15" rx="3" fill="#444" transform="rotate(-20 722 259)"/>
  <!-- Hammer -->
  <line x1="740" y1="290" x2="780" y2="270" stroke="#8B4513" stroke-width="3" stroke-linecap="round"/>
  <rect x="775" y="260" width="16" height="12" rx="2" fill="#666" transform="rotate(-20 783 266)"/>
  <!-- Father figure -->
  <g transform="translate(250, 180)">
    <circle cx="0" cy="0" r="25" fill="#f0d5b8"/>
    <rect x="-20" y="22" width="40" height="55" rx="10" fill="#2a5a58"/>
    <line x1="-8" y1="22" x2="-18" y2="75" stroke="#2a5a58" stroke-width="6" stroke-linecap="round"/>
    <line x1="8" y1="22" x2="18" y2="75" stroke="#2a5a58" stroke-width="6" stroke-linecap="round"/>
    <!-- Hair -->
    <path d="M-20-10 Q-22-30-5-30 Q5-30 20-20 Q22-35 15-38 Q5-42-10-40 Q-25-38-22-20Z" fill="#1a1a2e"/>
    <!-- Thobe details -->
    <rect x="-18" y="50" width="36" height="2" rx="1" fill="#1a4a48"/>
  </g>
  <!-- Boy figure 1 -->
  <g transform="translate(550, 200)">
    <circle cx="0" cy="0" r="18" fill="#f0d5b8"/>
    <rect x="-14" y="16" width="28" height="40" rx="8" fill="#3a7a78"/>
    <line x1="-5" y1="16" x2="-12" y2="55" stroke="#3a7a78" stroke-width="5" stroke-linecap="round"/>
    <line x1="5" y1="16" x2="12" y2="55" stroke="#3a7a78" stroke-width="5" stroke-linecap="round"/>
    <!-- Safety goggles -->
    <rect x="-15" y="-8" width="30" height="10" rx="5" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Hair -->
    <path d="M-15-8 Q-16-25 0-25 Q16-25 16-8" fill="#1a1a2e"/>
  </g>
  <!-- Boy figure 2 -->
  <g transform="translate(640, 210)">
    <circle cx="0" cy="0" r="15" fill="#f0d5b8"/>
    <rect x="-12" y="14" width="24" height="35" rx="7" fill="#4a8a78"/>
    <line x1="-4" y1="14" x2="-10" y2="48" stroke="#4a8a78" stroke-width="4" stroke-linecap="round"/>
    <line x1="4" y1="14" x2="10" y2="48" stroke="#4a8a78" stroke-width="4" stroke-linecap="round"/>
    <rect x="-13" y="-6" width="26" height="8" rx="4" fill="none" stroke="#333" stroke-width="1.5"/>
    <path d="M-12-6 Q-14-20 0-20 Q14-20 14-6" fill="#1a1a2e"/>
  </g>
  <!-- Boy figure 3 (smallest) -->
  <g transform="translate(460, 215)">
    <circle cx="0" cy="0" r="12" fill="#f0d5b8"/>
    <rect x="-10" y="10" width="20" height="28" rx="6" fill="#5a9a88"/>
    <line x1="-3" y1="10" x2="-8" y2="38" stroke="#5a9a88" stroke-width="4" stroke-linecap="round"/>
    <line x1="3" y1="10" x2="8" y2="38" stroke="#5a9a88" stroke-width="4" stroke-linecap="round"/>
    <rect x="-11" y="-5" width="22" height="7" rx="3" fill="none" stroke="#333" stroke-width="1.5"/>
    <path d="M-10-5 Q-12-16 0-16 Q12-16 12-5" fill="#1a1a2e"/>
  </g>
  <!-- Wood shavings -->
  <path d="M390 305 Q400 295 410 305" stroke="#c4956a" stroke-width="1.5" fill="none" opacity=".5"/>
  <path d="M500 305 Q505 298 510 305" stroke="#c4956a" stroke-width="1.5" fill="none" opacity=".4"/>
  <path d="M580 308 Q585 300 590 308" stroke="#c4956a" stroke-width="1.5" fill="none" opacity=".4"/>
  <!-- Title overlay is done via CSS, so no text here -->
</svg>
