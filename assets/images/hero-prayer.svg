<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="gp1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="40%" style="stop-color:#1a5c4a"/>
      <stop offset="100%" style="stop-color:#3a9d8e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#6abfb8;stop-opacity:.2"/>
      <stop offset="100%" style="stop-color:#6abfb8;stop-opacity:0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#gp1)"/>
  <circle cx="600" cy="280" r="120" fill="url(#glow)"/>
  <!-- Prayer rug silhouette -->
  <path d="M540 380 L550 300 L650 300 L660 380 Z" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <path d="M555 380 L565 320 L635 320 L645 380 Z" fill="#6abfb8" opacity=".08"/>
  <!-- Arch (mihrab) -->
  <path d="M570 300 Q600 240 630 300" fill="none" stroke="#fd781c" stroke-width="2" opacity=".3"/>
  <!-- Small figure and child figure -->
  <circle cx="590" cy="280" r="8" fill="#6abfb8" opacity=".3"/>
  <circle cx="610" cy="285" r="5" fill="#6abfb8" opacity=".25"/>
  <!-- Star -->
  <circle cx="600" cy="170" r="2" fill="#fd781c" opacity=".6"/>
  <text x="600" y="160" font-family="Arial" font-size="12" fill="#6abfb8" opacity=".2" text-anchor="middle">✦</text>
  <!-- Dots -->
  <circle cx="520" cy="250" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="680" cy="240" r="2" fill="#6abfb8" opacity=".35"/>
  <circle cx="540" cy="310" r="1.5" fill="#fd781c" opacity=".3"/>
  <circle cx="660" cy="320" r="1.5" fill="#6abfb8" opacity=".25"/>
</svg>
