<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#0a6b66"/>
      <stop offset="100%" style="stop-color:#3a7569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Two buildings -->
  <rect x="520" y="270" width="60" height="120" fill="#6abfb8" opacity=".2" stroke="#6abfb8" stroke-width="2"/>
  <rect x="620" y="300" width="50" height="90" fill="#fd781c" opacity=".2" stroke="#fd781c" stroke-width="2"/>
  <!-- Mosque dome -->
  <path d="M520 270 Q550 220 580 270" fill="#6abfb8" opacity=".3"/>
  <text x="550" y="420" text-anchor="middle" fill="#6abfb8" font-family="sans-serif" font-size="14" opacity=".5">قرب الحرم</text>
  <text x="645" y="420" text-anchor="middle" fill="#fd781c" font-family="sans-serif" font-size="14" opacity=".5">اقتصادي</text>
  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="3" fill="#6abfb8" opacity=".3"/>
  <circle cx="1120" cy="520" r="4" fill="#6abfb8" opacity=".25"/>
  <circle cx="200" cy="500" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="1000" cy="100" r="2" fill="#fd781c" opacity=".3"/>
  <circle cx="600" cy="60" r="3" fill="#6abfb8" opacity=".2"/>
  <circle cx="350" cy="120" r="2" fill="#6abfb8" opacity=".3"/>
  <circle cx="850" cy="480" r="2" fill="#fd781c" opacity=".2"/>
</svg>