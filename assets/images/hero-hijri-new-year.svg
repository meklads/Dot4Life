<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="hn1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#1a2a28"/><stop offset="100%" stop-color="#054241"/></linearGradient>
    <linearGradient id="hn2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6ABFB8" stop-opacity=".3"/><stop offset="100%" stop-color="#6ABFB8" stop-opacity="0"/></linearGradient>
    <radialGradient id="moon-grad" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff" stop-opacity=".95"/><stop offset="100%" stop-color="#E8E0C8" stop-opacity=".5"/></radialGradient>
  </defs>
  <!-- dark night background -->
  <rect width="1200" height="420" fill="url(#hn1)"/>
  <!-- stars -->
  <g fill="#fff" opacity=".6">
    <circle cx="80" cy="60" r="1.5"/><circle cx="200" cy="45" r="1"/><circle cx="320" cy="80" r="1.8"/>
    <circle cx="450" cy="30" r="1.2"/><circle cx="580" cy="65" r="1"/><circle cx="700" cy="40" r="1.5"/>
    <circle cx="820" cy="75" r="1.3"/><circle cx="950" cy="35" r="1"/><circle cx="1080" cy="55" r="1.8"/>
    <circle cx="150" cy="120" r="1"/><circle cx="390" cy="140" r="1.4"/><circle cx="630" cy="110" r="1.2"/>
    <circle cx="860" cy="130" r="1"/><circle cx="1110" cy="100" r="1.5"/>
    <circle cx="50" cy="200" r="1.2"/><circle cx="1140" cy="180" r="1"/>
    <circle cx="270" cy="170" r="0.8"/><circle cx="510" cy="150" r="1.1"/>
    <circle cx="760" cy="160" r="0.9"/><circle cx="1010" cy="140" r="1.3"/>
  </g>
  <!-- crescent moon -->
  <g transform="translate(990, 80)">
    <circle cx="0" cy="0" r="38" fill="url(#moon-grad)" filter="url(#glow)"/>
    <circle cx="12" cy="-8" r="32" fill="url(#hn1)"/>
  </g>
  <!-- horizontal decorative line -->
  <rect x="0" y="210" width="1200" height="1" fill="#6ABFB8" opacity=".12"/>
  <!-- mosque silhouette -->
  <g fill="#6ABFB8" opacity=".08">
    <rect x="360" y="270" width="480" height="100" rx="4"/>
    <rect x="500" y="230" width="200" height="40" rx="3"/>
    <!-- minarets -->
    <rect x="380" y="240" width="12" height="130" rx="2"/>
    <rect x="808" y="240" width="12" height="130" rx="2"/>
    <!-- domes -->
    <ellipse cx="600" cy="230" rx="50" ry="25"/>
    <ellipse cx="460" cy="250" rx="20" ry="12"/>
    <ellipse cx="740" cy="250" rx="20" ry="12"/>
  </g>
  <!-- ground line -->
  <rect x="0" y="370" width="1200" height="50" fill="#6ABFB8" opacity=".06" rx="8"/>
  <!-- decorative geometric pattern -->
  <g stroke="#6ABFB8" stroke-width="1" opacity=".06" fill="none">
    <polygon points="100,370 140,320 180,370"/>
    <polygon points="300,370 340,330 380,370"/>
    <polygon points="820,370 860,330 900,370"/>
    <polygon points="1020,370 1060,320 1100,370"/>
  </g>
  <!-- text: 1448 هـ -->
  <text x="600" y="360" text-anchor="middle" font-family="Almarai,'Traditional Arabic',sans-serif" font-size="22" fill="#6ABFB8" opacity=".15" font-weight="700">١٤٤٨ هـ — 1 محرم</text>
  <!-- subtle golden accent line -->
  <rect x="400" y="215" width="400" height="2" fill="#FD781C" opacity=".15" rx="1"/>
</svg>
