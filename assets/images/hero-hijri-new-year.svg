<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="hn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2a28"/>
      <stop offset="55%" stop-color="#054241"/>
      <stop offset="100%" stop-color="#0a6b66"/>
    </linearGradient>
    <radialGradient id="hn-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#E8E0C8" stop-opacity=".55"/>
    </radialGradient>
    <radialGradient id="hn-glow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FD781C" stop-opacity=".15"/>
      <stop offset="100%" stop-color="#FD781C" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#hn-bg)"/>
  <circle cx="600" cy="230" r="120" fill="url(#hn-glow)"/>

  <!-- Stars -->
  <g fill="#fff" opacity=".65">
    <circle cx="80" cy="55" r="1.5"/><circle cx="200" cy="40" r="1"/><circle cx="320" cy="75" r="1.8"/>
    <circle cx="450" cy="28" r="1.2"/><circle cx="580" cy="60" r="1"/><circle cx="700" cy="35" r="1.5"/>
    <circle cx="820" cy="70" r="1.3"/><circle cx="950" cy="30" r="1"/><circle cx="1080" cy="50" r="1.8"/>
    <circle cx="150" cy="115" r="1"/><circle cx="390" cy="135" r="1.4"/><circle cx="630" cy="105" r="1.2"/>
    <circle cx="860" cy="125" r="1"/><circle cx="1110" cy="95" r="1.5"/>
  </g>

  <!-- Crescent moon -->
  <g transform="translate(980, 75)">
    <circle cx="0" cy="0" r="36" fill="url(#hn-moon)"/>
    <circle cx="11" cy="-7" r="30" fill="url(#hn-bg)"/>
  </g>

  <!-- Open book / Hijra teaching -->
  <g transform="translate(600, 215)">
    <path d="M-95 55 L-95 -15 Q0 -45 95 -15 L95 55 Q0 25 -95 55Z" fill="#6ABFB8" opacity=".22" stroke="#6ABFB8" stroke-width="2" opacity=".5"/>
    <line x1="0" y1="-30" x2="0" y2="40" stroke="#6ABFB8" stroke-width="2" opacity=".45"/>
    <path d="M-70 10 L-25 0 M-70 25 L-30 18" stroke="#6ABFB8" stroke-width="2" opacity=".35"/>
    <path d="M70 10 L25 0 M70 25 L30 18" stroke="#6ABFB8" stroke-width="2" opacity=".35"/>
    <!-- upward journey arrows -->
    <path d="M-130 -5 L-130 -45 M-130 -45 L-140 -32 M-130 -45 L-120 -32" stroke="#FD781C" stroke-width="2.5" opacity=".65"/>
    <path d="M130 -5 L130 -45 M130 -45 L120 -32 M130 -45 L140 -32" stroke="#FD781C" stroke-width="2.5" opacity=".65"/>
  </g>

  <!-- Parent + child silhouettes -->
  <g opacity=".85">
    <circle cx="420" cy="250" r="14" fill="#6ABFB8" opacity=".5"/>
    <path d="M406 268 Q420 300 434 268" fill="#6ABFB8" opacity=".32"/>
    <circle cx="398" cy="268" r="8" fill="#FD781C" opacity=".55"/>
    <path d="M392 276 Q398 292 404 276" fill="#FD781C" opacity=".35"/>
  </g>
  <g opacity=".8">
    <circle cx="780" cy="250" r="14" fill="#6ABFB8" opacity=".5"/>
    <path d="M766 268 Q780 300 794 268" fill="#6ABFB8" opacity=".32"/>
  </g>

  <!-- Mosque silhouette (distant) -->
  <g fill="#6ABFB8" opacity=".12">
    <rect x="480" y="300" width="240" height="55" rx="3"/>
    <ellipse cx="600" cy="300" rx="38" ry="18"/>
    <rect x="465" y="280" width="10" height="75" rx="2"/>
    <rect x="725" y="280" width="10" height="75" rx="2"/>
  </g>

  <!-- Golden horizon line -->
  <rect x="350" y="318" width="500" height="2.5" fill="#FD781C" opacity=".45" rx="1"/>

  <!-- Hijri date -->
  <text x="600" y="365" text-anchor="middle" font-family="Almarai,'Traditional Arabic',sans-serif" font-size="20" fill="#6ABFB8" opacity=".35" font-weight="700">١ محرم — سنة جديدة</text>
</svg>
