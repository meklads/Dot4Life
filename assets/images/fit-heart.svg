<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="fh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054241" stop-opacity=".08"/>
      <stop offset="100%" stop-color="#6abfb8" stop-opacity=".05"/>
    </linearGradient>
    <linearGradient id="fh-pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#054241"/>
      <stop offset="50%" stop-color="#6abfb8"/>
      <stop offset="100%" stop-color="#054241"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fh-bg)" rx="20"/>
  <!-- Heart shape -->
  <path d="M200,110 C200,90 180,70 155,70 C125,70 105,95 105,120 C105,155 140,180 200,220 C260,180 295,155 295,120 C295,95 275,70 245,70 C220,70 200,90 200,110Z" fill="#6abfb8" opacity=".25"/>
  <!-- Pulse line -->
  <polyline points="40,150 120,150 145,110 165,180 185,90 200,150 215,130 235,170 255,100 280,150 360,150" fill="none" stroke="url(#fh-pulse)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".8"/>
  <!-- Small dots -->
  <circle cx="200" cy="220" r="3" fill="#fd781c" opacity=".5"/>
  <circle cx="120" cy="140" r="2" fill="#6abfb8" opacity=".4"/>
  <circle cx="280" cy="130" r="2" fill="#6abfb8" opacity=".4"/>
</svg>
