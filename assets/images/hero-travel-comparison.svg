<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054241"/>
      <stop offset="50%" stop-color="#0a6b66"/>
      <stop offset="100%" stop-color="#054241"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <circle cx="150" cy="350" r="320" fill="#6abfb8" opacity=".08"/>
  <circle cx="1050" cy="80" r="250" fill="#6abfb8" opacity=".06"/>
  <!-- Airplane icon (right side - international) -->
  <g transform="translate(820, 150) scale(1.2)">
    <path d="M2 16l4-2 6 4 8-14 4 2-6 14 4 2 3-4 2 1-1 5-3 1-6-3-8 4-4-2 8-4-6-4z" fill="#6abfb8" opacity=".9"/>
  </g>
  <!-- Car icon (left side - domestic) -->
  <g transform="translate(300, 170) scale(1.1)">
    <rect x="5" y="12" width="38" height="14" rx="3" fill="#6abfb8" opacity=".9"/>
    <rect x="12" y="6" width="24" height="8" rx="2" fill="#5aaf98"/>
    <circle cx="13" cy="26" r="5" fill="#054241"/>
    <circle cx="35" cy="26" r="5" fill="#054241"/>
  </g>
  <!-- Map pin icons -->
  <g transform="translate(200, 260)" opacity=".6">
    <path d="M0-8a8 8 0 0 1 16 0c0 6-8 16-8 16S0-2 0-8z" fill="#6abfb8"/>
    <circle cx="8" cy="-8" r="3" fill="#054241"/>
  </g>
  <g transform="translate(900, 260)" opacity=".6">
    <path d="M0-8a8 8 0 0 1 16 0c0 6-8 16-8 16S0-2 0-8z" fill="#fd781c"/>
    <circle cx="8" cy="-8" r="3" fill="#054241"/>
  </g>
  <!-- Sun icons -->
  <g transform="translate(450, 100)" opacity=".4">
    <circle cx="0" cy="0" r="10" fill="#fd781c"/>
    <path d="M0-15 L0-12 M0 12 L0 15 M-15 0 L-12 0 M12 0 L15 0" stroke="#fd781c" stroke-width="2"/>
  </g>
  <!-- Left label -->
  <text x="300" y="320" text-anchor="middle" fill="rgba(255,255,255,.5)" font-size="14" font-family="sans-serif" font-weight="600">🏠 Domestic</text>
  <!-- Right label -->
  <text x="850" y="320" text-anchor="middle" fill="rgba(255,255,255,.5)" font-size="14" font-family="sans-serif" font-weight="600">✈️ International</text>
  <!-- VS divider -->
  <text x="580" y="200" text-anchor="middle" fill="rgba(255,255,255,.7)" font-size="28" font-family="sans-serif" font-weight="800" opacity=".6">VS</text>
</svg>
