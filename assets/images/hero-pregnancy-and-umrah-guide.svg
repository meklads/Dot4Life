<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#0a6b66"/>
      <stop offset="100%" style="stop-color:#3a7569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Kaaba silhouette -->
  <rect x="540" y="240" width="120" height="140" rx="4" fill="#6abfb8" opacity=".12"/>
  <!-- Mother figure -->
  <circle cx="420" cy="300" r="20" fill="#6abfb8" opacity=".3"/>
  <path d="M400 340 Q420 370 440 340" fill="#6abfb8" opacity=".15"/>
  <circle cx="420" cy="350" r="25" fill="#fd781c" opacity=".08"/>
  <!-- Baby silhouette inside mother figure -->
  <circle cx="420" cy="350" r="10" fill="#fd781c" opacity=".15"/>
  <!-- Tawaf circles -->
  <circle cx="600" cy="310" r="100" fill="none" stroke="#6abfb8" stroke-width="1" stroke-dasharray="6 6" opacity=".15"/>
  <circle cx="600" cy="310" r="130" fill="none" stroke="#6abfb8" stroke-width="1" stroke-dasharray="4 8" opacity=".1"/>
  <!-- decorative elements -->
  <circle cx="80" cy="80" r="3" fill="#6abfb8" opacity=".25"/>
  <circle cx="1120" cy="520" r="4" fill="#fd781c" opacity=".2"/>
  <circle cx="200" cy="500" r="2" fill="#fd781c" opacity=".3"/>
  <circle cx="1000" cy="100" r="2" fill="#fd781c" opacity=".25"/>
  <circle cx="350" cy="120" r="2" fill="#6abfb8" opacity=".25"/>
</svg>