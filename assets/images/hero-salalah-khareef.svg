<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#0a6b66"/>
      <stop offset="100%" style="stop-color:#3a7569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Mountain and clouds -->
  <path d="M400 350 L550 200 L700 350" fill="#6abfb8" opacity=".15"/>
  <path d="M500 350 L650 220 L800 350" fill="#6abfb8" opacity=".1"/>
  <!-- Clouds -->
  <ellipse cx="520" cy="180" rx="30" ry="12" fill="#6abfb8" opacity=".3"/>
  <ellipse cx="540" cy="175" rx="20" ry="10" fill="#6abfb8" opacity=".25"/>
  <ellipse cx="680" cy="190" rx="25" ry="10" fill="#6abfb8" opacity=".2"/>
  <ellipse cx="700" cy="185" rx="18" ry="8" fill="#6abfb8" opacity=".25"/>
  <!-- Rain -->
  <line x1="520" y1="200" x2="515" y2="220" stroke="#6abfb8" stroke-width="1" opacity=".4"/>
  <line x1="540" y1="195" x2="535" y2="215" stroke="#6abfb8" stroke-width="1" opacity=".4"/>
  <line x1="680" y1="210" x2="675" y2="230" stroke="#6abfb8" stroke-width="1" opacity=".3"/>
  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="3" fill="#6abfb8" opacity=".3"/>
  <circle cx="1120" cy="520" r="4" fill="#6abfb8" opacity=".25"/>
  <circle cx="200" cy="500" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="1000" cy="100" r="2" fill="#fd781c" opacity=".3"/>
  <circle cx="600" cy="60" r="3" fill="#6abfb8" opacity=".2"/>
  <circle cx="350" cy="120" r="2" fill="#6abfb8" opacity=".3"/>
  <circle cx="850" cy="480" r="2" fill="#fd781c" opacity=".2"/>
</svg>