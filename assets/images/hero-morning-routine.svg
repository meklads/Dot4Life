<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="gmo1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="30%" style="stop-color:#fd781c;stop-opacity:.15"/>
      <stop offset="60%" style="stop-color:#3a7569"/>
      <stop offset="100%" style="stop-color:#6abfb8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#gmo1)"/>
  <!-- Sun rising -->
  <circle cx="600" cy="260" r="50" fill="#fd781c" opacity=".15"/>
  <circle cx="600" cy="260" r="30" fill="#fd781c" opacity=".2"/>
  <!-- Rays -->
  <line x1="600" y1="210" x2="600" y2="180" stroke="#fd781c" stroke-width="2" opacity=".3"/>
  <line x1="650" y1="220" x2="670" y2="200" stroke="#fd781c" stroke-width="2" opacity=".25"/>
  <line x1="550" y1="220" x2="530" y2="200" stroke="#fd781c" stroke-width="2" opacity=".25"/>
  <!-- Tea cup -->
  <rect x="575" y="340" width="50" height="35" rx="4" fill="#6abfb8" opacity=".25"/>
  <path d="M625 350 Q640 350 640 360 Q640 370 625 370" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".2"/>
  <!-- Steam -->
  <path d="M585 335 Q580 320 585 310" stroke="#6abfb8" stroke-width="2" fill="none" opacity=".3"/>
  <path d="M600 330 Q595 315 600 305" stroke="#6abfb8" stroke-width="2" fill="none" opacity=".25"/>
  <path d="M615 335 Q620 320 615 310" stroke="#fd781c" stroke-width="2" fill="none" opacity=".2"/>
  <!-- Book open -->
  <path d="M530 360 L530 400 L600 390 L600 350 Z" fill="#6abfb8" opacity=".15"/>
  <path d="M670 360 L670 400 L600 390 L600 350 Z" fill="#6abfb8" opacity=".1"/>
  <!-- Dots -->
  <circle cx="500" cy="280" r="2" fill="#fd781c" opacity=".5"/>
  <circle cx="700" cy="290" r="2" fill="#6abfb8" opacity=".4"/>
</svg>
