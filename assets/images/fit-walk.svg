<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="fwl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054241" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#6abfb8" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fwl-bg)" rx="20"/>
  <!-- Abstract family walking - parent 1 -->
  <circle cx="130" cy="120" r="12" fill="none" stroke="#054241" stroke-width="2.5" opacity=".45"/>
  <path d="M130,133 C128,145 120,155 115,170" fill="none" stroke="#054241" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <path d="M130,135 C138,150 142,165 140,180" fill="none" stroke="#054241" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <path d="M120,148 C108,155 100,158 90,162" fill="none" stroke="#6abfb8" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <path d="M138,148 C150,155 158,158 168,162" fill="none" stroke="#6abfb8" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  
  <!-- Child 1 -->
  <circle cx="210" cy="140" r="9" fill="none" stroke="#6abfb8" stroke-width="2.5" opacity=".45"/>
  <path d="M210,150 C208,160 202,168 198,180" fill="none" stroke="#6abfb8" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <path d="M210,150 C214,162 218,172 220,185" fill="none" stroke="#6abfb8" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <path d="M200,162 C192,167 186,170 180,173" fill="none" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".3"/>
  <path d="M218,162 C226,167 232,170 238,173" fill="none" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".3"/>
  
  <!-- Child 2 (younger/smaller) -->
  <circle cx="280" cy="148" r="7" fill="none" stroke="#054241" stroke-width="2" opacity=".4"/>
  <path d="M280,156 C278,166 274,174 270,185" fill="none" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <path d="M280,156 C284,166 288,174 292,185" fill="none" stroke="#054241" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  
  <!-- Ground path -->
  <path d="M40,230 Q120,218 200,225 Q280,232 360,222" fill="none" stroke="#6abfb8" stroke-width="1.5" stroke-dasharray="6 8" opacity=".3"/>
  
  <!-- Sun/energy -->
  <circle cx="320" cy="60" r="20" fill="none" stroke="#fd781c" stroke-width="2" opacity=".2"/>
  <line x1="340" y1="60" x2="355" y2="60" stroke="#fd781c" stroke-width="1.5" stroke-linecap="round" opacity=".15"/>
  <line x1="320" y1="40" x2="320" y2="30" stroke="#fd781c" stroke-width="1.5" stroke-linecap="round" opacity=".15"/>
  <line x1="335" y1="45" x2="345" y2="38" stroke="#fd781c" stroke-width="1.5" stroke-linecap="round" opacity=".15"/>
  <line x1="305" y1="45" x2="295" y2="38" stroke="#fd781c" stroke-width="1.5" stroke-linecap="round" opacity=".15"/>
</svg>
