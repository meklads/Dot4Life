<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="fs-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#054241" stop-opacity=".06"/>
      <stop offset="100%" stop-color="#6abfb8" stop-opacity=".04"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fs-bg)" rx="20"/>
  <!-- Abstract stretching figure - head -->
  <circle cx="180" cy="65" r="14" fill="none" stroke="#054241" stroke-width="2.5" opacity=".5"/>
  <!-- Body flowing line -->
  <path d="M180,80 C175,100 160,120 150,140 C140,160 155,175 165,190 C175,205 170,220 160,240" fill="none" stroke="#6abfb8" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  <!-- Arms reaching up -->
  <path d="M175,95 C140,75 120,55 115,35" fill="none" stroke="#054241" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <path d="M185,95 C200,70 220,50 235,40" fill="none" stroke="#054241" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <!-- Legs -->
  <path d="M162,185 C130,200 110,220 95,245" fill="none" stroke="#6abfb8" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <path d="M165,190 C180,215 195,230 220,240" fill="none" stroke="#6abfb8" stroke-width="2.5" stroke-linecap="round" opacity=".4"/>
  <!-- Energy dots -->
  <circle cx="230" cy="35" r="2.5" fill="#fd781c" opacity=".5"/>
  <circle cx="245" cy="50" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="110" cy="30" r="2" fill="#fd781c" opacity=".4"/>
  <!-- Ground line -->
  <line x1="60" y1="255" x2="340" y2="255" stroke="#054241" stroke-width="1" opacity=".15"/>
</svg>
