<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#054241"/>
      <stop offset="50%" style="stop-color:#0a6b66"/>
      <stop offset="100%" style="stop-color:#3a7569"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Body outline -->
  <circle cx="600" cy="230" r="40" fill="none" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <line x1="560" y1="300" x2="550" y2="400" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <line x1="640" y1="300" x2="650" y2="400" stroke="#6abfb8" stroke-width="2" opacity=".3"/>
  <ellipse cx="600" cy="300" rx="50" ry="30" fill="none" stroke="#fd781c" stroke-width="2" opacity=".5" stroke-dasharray="4,3"/>
  <ellipse cx="600" cy="300" rx="30" ry="18" fill="#fd781c" opacity=".15"/>
  <text x="600" y="450" text-anchor="middle" fill="#6abfb8" font-family="sans-serif" font-size="14" opacity=".5">الدهون الحشوية</text>
  <!-- Decorative dots -->
  <circle cx="80" cy="80" r="3" fill="#6abfb8" opacity=".3"/>
  <circle cx="1120" cy="520" r="4" fill="#6abfb8" opacity=".25"/>
  <circle cx="200" cy="500" r="2" fill="#fd781c" opacity=".4"/>
  <circle cx="1000" cy="100" r="2" fill="#fd781c" opacity=".3"/>
  <circle cx="600" cy="60" r="3" fill="#6abfb8" opacity=".2"/>
  <circle cx="350" cy="120" r="2" fill="#6abfb8" opacity=".3"/>
  <circle cx="850" cy="480" r="2" fill="#fd781c" opacity=".2"/>
</svg>