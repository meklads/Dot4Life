<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-lang="en">
<head>
  <script>(function(){var t=localStorage.getItem('dfl-theme')||'light';var l=localStorage.getItem('dfl-lang')||'en';var h=document.documentElement;h.setAttribute('data-theme',t);h.setAttribute('data-lang',l);h.setAttribute('lang',l==='ar'?'ar':'en');h.setAttribute('dir',l==='ar'?'rtl':'ltr');})();</script>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Notes — DOTFORLIFE | ملاحظاتي</title>
  <meta name="description" content="Quick notes and family reminders. Write it down before it disappears."/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,400&family=Inter:wght@300;400;500;600&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles/global.css"/>
<style>
  :root{
    --text:#1A1410;--text-2:#5C534A;--muted:#9A9188;
    --body-bg:#FAF8F4;--card-bg:#FFFFFF;--cream:#F5F0E8;
    --cream-d:#EDE6D8;--border:#E0D8CC;--gold:#B8861A;--gold-d:#8A620F;
    --green:#1B7A4E;--rose:#B8705A;--blue:#0F3D6E;
    --font-serif:'Crimson Pro',Georgia,serif;
    --font-ui:'Inter',system-ui,sans-serif;
    --font-ar:'Almarai','Segoe UI',sans-serif;
    --radius:6px;
  }
  [data-theme="dark"]{
    --text:#EDE8E0;--text-2:#B8B0A4;--muted:#7A746C;
    --body-bg:#12100E;--card-bg:#1E1A16;--cream:#1E1A16;
    --cream-d:#252018;--border:#302820;--gold:#D4A832;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--font-ui);color:var(--text);background:var(--body-bg);line-height:1.6;transition:background .3s,color .3s;}
  [data-lang="ar"] body{font-family:var(--font-ar);}
  .en{display:inline;}.ar{display:none;}
  [data-lang="ar"] .en{display:none;}[data-lang="ar"] .ar{display:inline;}
  a{color:inherit;text-decoration:none;}

  /* NAVBAR */
  #navbar{position:sticky;top:0;z-index:100;min-height:64px;height:auto;overflow:visible;background:rgba(250,248,244,0.97);border-bottom:1px solid var(--border);backdrop-filter:blur(16px);display:flex;align-items:center;justify-content:center;}
  [data-theme="dark"] #navbar{background:rgba(18,16,14,0.97);}
  #navbar.scrolled{box-shadow:0 2px 20px rgba(0,0,0,.07);}
  .nav-inner{max-width:780px;width:100%;padding:0 24px;display:flex;align-items:center;justify-content:space-between;}
  .nav-logo img{height:130px;width:auto;display:block;margin:4px 0 8px;}
  @media(max-width:600px){.nav-logo img{height:80px;}}
  .nav-os-links{display:flex;gap:0;align-items:center;list-style:none;}
  .nav-os-links a{font-size:.78rem;font-weight:500;letter-spacing:.05em;padding:5px 10px;border-radius:6px;color:var(--text-2);transition:color .2s,background .2s;}
  .nav-os-links a:hover,.nav-os-links a.active{color:var(--gold);}
  .nav-os-links .home-link{font-size:.75rem;color:var(--muted);margin-right:4px;}
  @media(max-width:480px){.nav-os-links .hide-sm{display:none;}}
  .nav-controls{display:flex;gap:.5rem;align-items:center;}
  .nav-btn{cursor:pointer;border:1px solid var(--border);border-radius:var(--radius);padding:.3rem .6rem;font-size:.74rem;font-weight:600;background:transparent;color:var(--text-2);transition:all .2s;}
  .nav-btn:hover{border-color:var(--gold);color:var(--gold);}

  /* PAGE */
  #page{max-width:640px;margin:0 auto;padding:28px 20px 40px;}

  /* BREADCRUMB */
  .breadcrumb{font-size:.78rem;color:var(--muted);margin-bottom:20px;}
  .breadcrumb a{color:var(--muted);transition:color .2s;}
  .breadcrumb a:hover{color:var(--gold);}

  /* TITLE */
  .page-title{font-family:var(--font-serif);font-size:clamp(1.6rem,3vw,2.1rem);font-weight:300;color:var(--text);margin-bottom:24px;}
  [data-lang="ar"] .page-title{font-family:var(--font-ar);}

  /* COMPOSE */
  .compose-wrap{margin-bottom:24px;}
  .compose-box{
    width:100%;padding:1rem 1.1rem;
    border:1px solid var(--border);border-radius:14px;
    background:var(--card-bg);color:var(--text);
    font-size:.95rem;font-family:var(--font-ui);
    resize:none;min-height:76px;line-height:1.65;outline:none;
    transition:border-color .25s,box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
  }
  [data-lang="ar"] .compose-box{font-family:var(--font-ar);text-align:right;}
  .compose-box:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,134,26,.1);}
  .compose-box::placeholder{color:var(--muted);}
  .compose-hint{font-size:.72rem;color:var(--muted);margin-top:6px;text-align:right;}
  [data-lang="ar"] .compose-hint{text-align:left;}

  /* NOTES LIST — linear, not grid */
  #notes-list{display:flex;flex-direction:column;gap:10px;}

  .note-item{
    background:var(--card-bg);border:1px solid var(--border);
    border-radius:14px;padding:1rem 1.1rem;
    position:relative;
    transition:box-shadow .2s;
    animation:fadeUp .18s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .note-item:hover{box-shadow:0 4px 16px rgba(0,0,0,.07);}
  .note-body{font-size:.88rem;color:var(--text);line-height:1.6;word-break:break-word;padding-right:24px;}
  [data-lang="ar"] .note-body{padding-right:0;padding-left:24px;}
  .note-date{font-size:.68rem;color:var(--muted);margin-top:5px;}
  .note-del{
    position:absolute;top:.7rem;right:.7rem;
    background:none;border:none;color:var(--muted);
    font-size:.75rem;cursor:pointer;
    opacity:0;transition:opacity .15s,color .15s;
    padding:.15rem .3rem;border-radius:4px;line-height:1;
  }
  [data-lang="ar"] .note-del{right:auto;left:.7rem;}
  .note-item:hover .note-del,.note-item:focus-within .note-del{opacity:1;}
  .note-del:hover{color:#c0392b;}

  .notes-empty{text-align:center;padding:48px 16px;}
  .notes-empty .e-icon{font-size:2rem;opacity:.35;margin-bottom:.5rem;}
  .notes-empty p{font-size:.82rem;color:var(--muted);}
  [data-lang="ar"] .notes-empty p{font-family:var(--font-ar);}

  /* MOBILE NAV */
  .mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--card-bg);border-top:1px solid var(--border);padding:8px 0 env(safe-area-inset-bottom,8px);}
  @media(max-width:768px){.mobile-nav{display:flex;justify-content:space-around;}body{padding-bottom:64px;}}
  .mobile-nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 12px;font-size:.63rem;font-weight:500;color:var(--text-2);border:none;background:none;cursor:pointer;font-family:inherit;text-decoration:none;min-width:48px;}
  .mobile-nav-item.active{color:var(--gold);}
  .mobile-nav-item span:first-child{font-size:1.2rem;}
  [data-lang="ar"] .mobile-nav-item{font-family:var(--font-ar);}
</style>
</head>
<body>

<nav id="navbar">
  <div class="nav-inner">
    <a href="/" class="nav-logo"><img src="/logo1-transparent.png" alt="DOTFORLIFE"/></a>
    <ul class="nav-os-links">
      <li><a href="/" class="home-link">← <span class="en">Today</span><span class="ar">اليوم</span></a></li>
      <li><a href="/family.html" class="hide-sm"><span class="en">Family</span><span class="ar">العائلة</span></a></li>
      <li><a href="/tasks.html" class="hide-sm"><span class="en">Tasks</span><span class="ar">المهام</span></a></li>
      <li><a href="/notes.html" class="active"><span class="en">Notes</span><span class="ar">ملاحظات</span></a></li>
    </ul>
    <div class="nav-controls">
      <button class="nav-btn" id="lang-toggle"><span class="en">عربي</span><span class="ar">EN</span></button>
      <button class="nav-btn" id="theme-toggle"><span class="en">🌙</span><span class="ar">🌙</span></button>
    </div>
  </div>
</nav>

<main id="page">

  <div class="breadcrumb">
    <a href="/">DOTFORLIFE</a> / <span class="en">Notes</span><span class="ar">ملاحظات</span>
  </div>

  <h1 class="page-title">
    <span class="en">Notes</span>
    <span class="ar">ملاحظاتي</span>
  </h1>

  <div class="compose-wrap">
    <textarea class="compose-box" id="compose-text" rows="3" maxlength="500"
      placeholder="Write something down…"></textarea>
    <p class="compose-hint"><span class="en">↵ Enter to save</span><span class="ar">↵ Enter للحفظ</span></p>
  </div>

  <div id="notes-list"></div>

</main>

<nav class="mobile-nav" aria-label="Daily navigation">
  <a href="/" class="mobile-nav-item"><span>🏠</span><span class="en">Home</span><span class="ar">الرئيسية</span></a>
  <a href="/tasks.html" class="mobile-nav-item"><span>✅</span><span class="en">Tasks</span><span class="ar">المهام</span></a>
  <a href="/family.html" class="mobile-nav-item"><span>👨‍👩‍👧</span><span class="en">Family</span><span class="ar">العائلة</span></a>
  <a href="/notes.html" class="mobile-nav-item active"><span>📝</span><span class="en">Notes</span><span class="ar">ملاحظات</span></a>
</nav>

<script>
(function(){
  // ── Nav + theme
  var nb = document.getElementById('navbar');
  window.addEventListener('scroll', function(){ nb.classList.toggle('scrolled', window.scrollY>40); }, {passive:true});

  document.getElementById('lang-toggle').addEventListener('click', function(){
    var h = document.documentElement;
    var l = h.getAttribute('data-lang')==='ar'?'en':'ar';
    h.setAttribute('data-lang',l); h.setAttribute('lang',l); h.setAttribute('dir',l==='ar'?'rtl':'ltr');
    localStorage.setItem('dfl-lang',l);
    updatePlaceholder();
    render();
  });

  var themeBtn = document.getElementById('theme-toggle');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    localStorage.setItem('dfl-theme',t);
    var icon = t==='dark'?'☀️':'🌙';
    themeBtn.querySelector('.en').textContent = icon;
    themeBtn.querySelector('.ar').textContent = icon;
  }
  applyTheme(localStorage.getItem('dfl-theme')||'light');
  themeBtn.addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  });

  // ── Data
  function getNotes(){ try{ return JSON.parse(localStorage.getItem('dfl-notes')||'[]'); }catch(e){ return []; } }
  function setNotes(a){ localStorage.setItem('dfl-notes', JSON.stringify(a)); }
  function lang(){ return document.documentElement.getAttribute('data-lang')||'en'; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var compose = document.getElementById('compose-text');

  function updatePlaceholder(){
    var isAr = lang()==='ar';
    compose.placeholder = isAr ? 'اكتب شيئاً…' : 'Write something down…';
    compose.dir = isAr ? 'rtl' : 'ltr';
  }
  updatePlaceholder();

  // Save on Enter (not Shift+Enter)
  compose.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      saveNote();
    }
  });

  function saveNote(){
    var text = compose.value.trim();
    if(!text) return;
    var notes = getNotes();
    var d = new Date();
    notes.unshift({
      id: Date.now(),
      text: text,
      date: d.toLocaleDateString(lang()==='ar'?'ar-SA':'en-GB',{day:'numeric',month:'short'})
    });
    setNotes(notes);
    compose.value = '';
    compose.focus();
    render();
  }

  // ── Render
  function render(){
    var notes = getNotes();
    var list = document.getElementById('notes-list');
    if(!notes.length){
      list.innerHTML = '<div class="notes-empty"><div class="e-icon">📝</div><p>' +
        (lang()==='ar' ? 'لا توجد ملاحظات بعد.' : 'Nothing here yet. Write your first note above.') + '</p></div>';
      return;
    }
    list.innerHTML = notes.map(function(n){
      return '<div class="note-item" data-id="'+n.id+'">' +
        '<div class="note-body">'+esc(n.text)+'</div>' +
        '<div class="note-date">'+esc(n.date||'')+'</div>' +
        '<button class="note-del" data-id="'+n.id+'" aria-label="Delete">✕</button>' +
      '</div>';
    }).join('');

    list.querySelectorAll('.note-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var notes2 = getNotes().filter(function(n){ return n.id !== parseInt(btn.dataset.id); });
        setNotes(notes2);
        render();
      });
    });
  }

  render();
})();
</script>
</body>
</html>
