  <script>
(function(){
  /* theme */
  var tb=document.getElementById("theme-toggle");
  if(tb)tb.addEventListener("click",function(){
    var h=document.documentElement,t=h.getAttribute("data-theme")==="dark"?"light":"dark";
    h.setAttribute("data-theme",t);localStorage.setItem("dfl-theme",t);
  });
  /* lang */
  var lb=document.getElementById("lang-toggle");
  if(lb)lb.addEventListener("click",function(){
    var h=document.documentElement,l=h.getAttribute("data-lang")==="ar"?"en":"ar";
    h.setAttribute("data-lang",l);h.setAttribute("lang",l);
    h.setAttribute("dir",l==="ar"?"rtl":"ltr");localStorage.setItem("dfl-lang",l);
  });
  /* scroll shadow */
  var nb=document.getElementById("navbar");
  if(nb)window.addEventListener("scroll",function(){nb.classList.toggle("scrolled",window.scrollY>10);},{passive:true});
  /* reveal */
  if("IntersectionObserver" in window){
    var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting)e.target.classList.add("visible");});},{threshold:0.1});
    document.querySelectorAll(".reveal").forEach(function(el){io.observe(el);});
  } else document.querySelectorAll(".reveal").forEach(function(el){el.classList.add("visible");});
})();
</script>

  /* TITLE */

  /* COMPOSE */
  .compose-wrap{margin-bottom:24px;}
  .compose-box{
    width:100%;padding:1rem 1.1rem;
    border:1px solid var(--border);border-radius:14px;
    background:var(--card-bg);color:var(--text);
    font-size:.95rem;font-family:var(--font-ui);
    resize:none;min-height:76px;line-height:1.65;outline:none;
    transition:border-color .25s,box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
  }
  [data-lang="ar"] .compose-box{font-family:var(--font-ar);text-align:right;}
  .compose-box:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,134,26,.1);}
  .compose-box::placeholder{color:var(--muted);}
  .compose-hint{font-size:.72rem;color:var(--muted);margin-top:6px;text-align:right;}
  [data-lang="ar"] .compose-hint{text-align:left;}

  /* NOTES LIST — linear, not grid */
  #notes-list{display:flex;flex-direction:column;gap:10px;}

  .note-item{
    background:var(--card-bg);border:1px solid var(--border);
    border-radius:14px;padding:1rem 1.1rem;
    position:relative;
    transition:box-shadow .2s;
    animation:fadeUp .18s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .note-item:hover{box-shadow:0 4px 16px rgba(0,0,0,.07);}
  .note-body { padding-top:110px;font-size:.88rem;color:var(--text);line-height:1.6;word-break:break-word;padding-right:24px;}

  .note-del{
    position:absolute;top:.7rem;right:.7rem;
    background:none;border:none;color:var(--muted);
    font-size:.75rem;cursor:pointer;
    opacity:0;transition:opacity .15s,color .15s;
    padding:.15rem .3rem;border-radius:4px;line-height:1;
  }
  [data-lang="ar"] .note-del{right:auto;left:.7rem;}
  .note-item:hover .note-del,.note-item:focus-within .note-del{opacity:1;}
  .note-del:hover{color:#c0392b;}

<main id="page">

  <div class="breadcrumb">
    <a href="/">DOTFORLIFE</a> / <span class="en">Notes</span><span class="ar">ملاحظات</span>
  </div>

  <h1 class="page-title">
    <span class="en">Notes</span>
    <span class="ar">ملاحظاتي</span>
  </h1>

  <div class="compose-wrap">
    <textarea class="compose-box" id="compose-text" rows="3" maxlength="500"
      placeholder="Write something down…"></textarea>
    <p class="compose-hint"><span class="en">↵ Enter to save</span><span class="ar">↵ Enter للحفظ</span></p>
  </div>

  <div id="notes-list"></div>

</main>



<script>
(function(){
  // ── Nav + theme
  var nb = document.getElementById('navbar');
  window.addEventListener('scroll', function(){ nb.classList.toggle('scrolled', window.scrollY>40); }, {passive:true});

  document.getElementById('lang-toggle').addEventListener('click', function(){
    var h = document.documentElement;
    var l = h.getAttribute('data-lang')==='ar'?'en':'ar';
    h.setAttribute('data-lang',l); h.setAttribute('lang',l); h.setAttribute('dir',l==='ar'?'rtl':'ltr');
    localStorage.setItem('dfl-lang',l);
    updatePlaceholder();
    render();
  });

  var themeBtn = document.getElementById('theme-toggle');
  function applyTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    localStorage.setItem('dfl-theme',t);
    var icon = t==='dark'?'☀️':'🌙';
    themeBtn.querySelector('.en').textContent = icon;
    themeBtn.querySelector('.ar').textContent = icon;
  }
  applyTheme(localStorage.getItem('dfl-theme')||'light');
  themeBtn.addEventListener('click', function(){
    applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
  });

  // ── Data
  function getNotes(){ try{ return JSON.parse(localStorage.getItem('dfl-notes')||'[]'); }catch(e){ return []; } }
  function setNotes(a){ localStorage.setItem('dfl-notes', JSON.stringify(a)); }
  function lang(){ return document.documentElement.getAttribute('data-lang')||'en'; }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  var compose = document.getElementById('compose-text');

  function updatePlaceholder(){
    var isAr = lang()==='ar';
    compose.placeholder = isAr ? 'اكتب شيئاً…' : 'Write something down…';
    compose.dir = isAr ? 'rtl' : 'ltr';
  }
  updatePlaceholder();

  // Save on Enter (not Shift+Enter)
  compose.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey){
      e.preventDefault();
      saveNote();
    }
  });

  function saveNote(){
    var text = compose.value.trim();
    if(!text) return;
    var notes = getNotes();
    var d = new Date();
    notes.unshift({
      id: Date.now(),
      text: text,
      date: d.toLocaleDateString(lang()==='ar'?'ar-SA':'en-GB',{day:'numeric',month:'short'})
    });
    setNotes(notes);
    compose.value = '';
    compose.focus();
    render();
  }

  // ── Render
  function render(){
    var notes = getNotes();
    var list = document.getElementById('notes-list');
    if(!notes.length){
      list.innerHTML = '<div class="notes-empty"><div class="e-icon">📝</div><p>' +
        (lang()==='ar' ? 'لا توجد ملاحظات بعد.' : 'Nothing here yet. Write your first note above.') + '</p></div>';
      return;
    }
    list.innerHTML = notes.map(function(n){
      return '<div class="note-item" data-id="'+n.id+'">' +
        '<div class="note-body">'+esc(n.text)+'</div>' +
        '<div class="note-date">'+esc(n.date||'')+'</div>' +
        '<button class="note-del" data-id="'+n.id+'" aria-label="Delete">✕</button>' +
      '</div>';
    }).join('');

    list.querySelectorAll('.note-del').forEach(function(btn){
      btn.addEventListener('click', function(){
        var notes2 = getNotes().filter(function(n){ return n.id !== parseInt(btn.dataset.id); });
        setNotes(notes2);
        render();
      });
    });
  }

  render();
})();
</script>
