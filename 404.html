<script>
(function(){
  // Clean URL → .html redirect for GitHub Pages
  var path = window.location.pathname.replace(/\/$/, ''); // strip trailing slash
  if (!path || path === '') return; // root — already handled by index.html
  
  // Don't redirect if already ends with .html, or other known extensions
  if (/\.\w+$/.test(path)) return;
  
  // Try appending .html
  var tryUrl = path + '.html';
  var xhr = new XMLHttpRequest();
  xhr.open('HEAD', tryUrl, true);
  xhr.onreadystatechange = function(){
    if (xhr.readyState === 4){
      if (xhr.status === 200){
        // File exists — redirect with 301-equivalent
        var qs = window.location.search || '';
        window.location.replace(tryUrl + qs);
      } else if (xhr.status === 404) {
        // Try /index.html variant (for directory-style URLs)
        var dirTry = path + '/index.html';
        var xhr2 = new XMLHttpRequest();
        xhr2.open('HEAD', dirTry, true);
        xhr2.onreadystatechange = function(){
          if (xhr2.readyState === 4 && xhr2.status === 200){
            var qs = window.location.search || '';
            window.location.replace(dirTry + qs);
          } else {
            // Show 404 page content
            document.title = 'Page Not Found | DOTFORLIFE';
            document.getElementById('status').textContent = '404';
            document.getElementById('msg').style.display = 'block';
            document.getElementById('loading').style.display = 'none';
          }
        };
        xhr2.send();
      }
    }
  };
  xhr.send();
})();
</script>
