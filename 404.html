<style>
  body{margin:0;padding:2rem;font-family:system-ui,-apple-system,sans-serif;background:#f7f8fc;color:#1a1e24;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;text-align:center;}
  h1{font-size:2rem;font-weight:600;margin-bottom:.5rem;}
  p{color:#5c534a;max-width:400px;line-height:1.6;}
  a{color:#2a9a98;text-decoration:underline;}
  .ar{display:none;}
  html[data-lang="ar"] .en{display:none;}
  html[data-lang="ar"] .ar{display:inline;}
  html[data-lang="ar"] body{font-family:Almarai,system-ui,sans-serif;}
</style>
<script>
(function(){
  try {
    var p = new URLSearchParams(location.search);
    var l = p.get('lang') || localStorage.getItem('dfl-lang') || 'en';
    document.documentElement.setAttribute('data-lang', l);
    document.documentElement.setAttribute('lang', l);
    document.documentElement.setAttribute('dir', l === 'ar' ? 'rtl' : 'ltr');
  } catch (e) {}
  var path = window.location.pathname.replace(/\/$/, '');
  if (!path || path === '' || /\.\w+$/.test(path)) return;
  var tryUrl = path + '.html';
  var xhr = new XMLHttpRequest();
  xhr.open('HEAD', tryUrl, true);
  xhr.onreadystatechange = function () {
    if (xhr.readyState !== 4) return;
    if (xhr.status === 200) {
      window.location.replace(tryUrl + (window.location.search || ''));
      return;
    }
    if (xhr.status !== 404) return;
    var dirTry = path + '/index.html';
    var xhr2 = new XMLHttpRequest();
    xhr2.open('HEAD', dirTry, true);
    xhr2.onreadystatechange = function () {
      if (xhr2.readyState === 4 && xhr2.status === 200) {
        window.location.replace(dirTry + (window.location.search || ''));
      }
    };
    xhr2.send();
  };
  xhr.send();
})();
</script>
