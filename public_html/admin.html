<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light" data-lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="UTF-8"/>
  <script>
    (function(){
      var p = new URLSearchParams(location.search);
      var gd = (function(){
        try {
          var z = (Intl.DateTimeFormat().resolvedOptions().timeZone || "");
          return /Riyadh|Dubai|Qatar|Bahrain|Kuwait|Muscat|Baghdad|Amman|Beirut|Damascus|Aden|Cairo|Khartoum/i.test(z) ? "ar" : "en";
        } catch(e) { return "ar"; }
      })();
      var l = p.get("lang") || localStorage.getItem("dfl-lang") || gd;
      var t = p.get("theme") || localStorage.getItem("dfl-theme") || "light";
      var h = document.documentElement;
      h.setAttribute("data-theme", t);
      h.setAttribute("data-lang", l);
      h.setAttribute("lang", l);
      h.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
      if(p.get("lang")) localStorage.setItem("dfl-lang", l);
      if(p.get("theme")) localStorage.setItem("dfl-theme", t);
    })()
  </script>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <meta name="description" content="Secure Internal Admin Dashboard for DOTFORLIFE."/>
  <title>Dot4Life | Secure Admin</title>
  <link rel="icon" href="/favicon.ico"/>
  <link rel="stylesheet" href="/styles/pages/admin.css?v=9.0.1">
  <style>
    /* Security Overlay for hidden access */
    #security-gate {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #F5F1EB; z-index: 10000; display: flex;
      align-items: center; justify-content: center; flex-direction: column;
    }
    .gate-icon { font-size: 3rem; margin-bottom: 20px; opacity: 0.2; }
    .gate-msg { font-family: sans-serif; color: #8A7F74; font-size: 0.9rem; }
  </style>
</head>
<body>

<!-- 🔒 SECURITY GATE: Only opens with ?access=dot4life -->
<div id="security-gate">
  <div class="gate-icon">🛡️</div>
  <div class="gate-msg">Secure Access Required</div>
</div>

<!-- ════════════════════════════
     LOGIN VIEW
     ════════════════════════════ -->
<div id="view-login" style="display:none;">
  <div class="login-wrap">
    <div class="login-mark">
      <div class="dot">🛡️</div>
      <h1>Dot4Life Secure Admin</h1>
      <p>Authorized Personnel Only</p>
    </div>
    <div class="login-card">
      <div class="field">
        <label>Admin Password</label>
        <input type="password" id="pw" placeholder="••••••••" autocomplete="current-password"/>
      </div>
      <button class="btn-login" id="loginBtn" onclick="login()">Unlock Dashboard</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>
</div>

<!-- ════════════════════════════
     APP VIEW (Main Dashboard)
     ════════════════════════════ -->
<div id="view-app" style="display:none;">
  <div class="topbar">
    <div class="topbar-brand">
      <a href="/" style="display:flex;align-items:center;text-decoration:none;">
        <img loading="lazy" src="/logo1-transparent.webp" alt="Dot4Life" style="height:34px;">
      </a>
    </div>
    <div class="topbar-right">
      <span class="topbar-tag">Admin Verified</span>
      <button class="btn-signout" onclick="signout()">Lock & Exit</button>
    </div>
  </div>

  <div class="page">
    <div class="filter-bar">
      <button class="filter-pill active" data-f="all" onclick="setFilter('all')">All Capsules</button>
      <button class="filter-pill" data-f="pending_review" onclick="setFilter('pending_review')">Review</button>
      <button class="filter-pill" data-f="published" onclick="setFilter('published')">Live</button>
      <div class="filter-spacer"></div>
      <button class="btn-generate" onclick="generateWeek()">✨ Generate Week</button>
      <button class="btn-refresh" onclick="load()">🔄 Refresh</button>
    </div>

    <div id="listMeta" class="list-meta"></div>
    <div id="capsuleList" class="capsule-list">
      <div class="state-loading">Syncing with server...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ═══════════════════════════════════════
  //  SECURITY & AUTH LOGIC
  // ═══════════════════════════════════════
  const ACCESS_KEY = "dot4life"; // The secret URL parameter
  const LOCAL_HASH = "f7b074395b6597bf02d3a9a66f11451bbc477e8482d281e3e697c5930f2f748f"; // Default: hghgj123
  let API = 'https://dot4life-production.up.railway.app/api';
  let token = sessionStorage.getItem('d4l_token') || '';
  let filter = 'all';
  let allCapsules = [];

  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    
    // Step 1: Check Secret URL Access
    if (params.get('access') === ACCESS_KEY || localStorage.getItem('d4l_access_verified')) {
      document.getElementById('security-gate').style.display = 'none';
      localStorage.setItem('d4l_access_verified', 'true');
      
      if (token) {
        show('app');
        load();
      } else {
        show('login');
      }
    } else {
      // Keep gate locked
      console.warn("Unauthorized access attempt.");
    }

    document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
  });

  async function sha256(msg) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(msg));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  }

  async function login() {
    const pw = document.getElementById('pw').value.trim();
    const btn = document.getElementById('loginBtn');
    const err = document.getElementById('loginErr');

    if (!pw) return;
    btn.disabled = true;
    btn.textContent = 'Verifying...';
    err.style.display = 'none';

    const inputHash = await sha256(pw);

    // Try API Login first, fallback to Local Hash
    try {
      const r = await fetch(`${API}/admin/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: pw })
      });
      const data = await r.json();

      if (r.ok && data.token) {
        token = data.token;
        sessionStorage.setItem('d4l_token', token);
        show('app');
        load();
      } else if (inputHash === LOCAL_HASH) {
        token = 'local-' + Date.now();
        sessionStorage.setItem('d4l_token', token);
        show('app');
        load();
      } else {
        throw new Error("Invalid Credentials");
      }
    } catch (e) {
      if (inputHash === LOCAL_HASH) {
        token = 'local-' + Date.now();
        sessionStorage.setItem('d4l_token', token);
        show('app');
        load();
      } else {
        err.textContent = 'Access Denied: Incorrect Password.';
        err.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Unlock Dashboard';
      }
    }
  }

  function signout() {
    sessionStorage.removeItem('d4l_token');
    localStorage.removeItem('d4l_access_verified');
    window.location.href = "/"; // Redirect to home for safety
  }

  // ═══════════════════════════════════════
  //  DASHBOARD LOGIC (Simplified for UX)
  // ═══════════════════════════════════════
  function show(view) {
    document.getElementById('view-login').style.display = view === 'login' ? 'flex' : 'none';
    document.getElementById('view-app').style.display = view === 'app' ? 'block' : 'none';
  }

  async function load() {
    const list = document.getElementById('capsuleList');
    list.innerHTML = '<div class="state-loading">Fetching latest data...</div>';
    
    try {
      const r = await fetch(`${API}/admin/capsules`, {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      const data = await r.json();
      if (r.ok) {
        allCapsules = data.capsules || [];
        render();
      } else {
        list.innerHTML = `<div class="state-empty">Offline Mode: API Connection Failed.</div>`;
      }
    } catch (e) {
      list.innerHTML = `<div class="state-empty">Offline Mode: Server Unreachable.</div>`;
    }
  }

  function render() {
    const list = document.getElementById('capsuleList');
    let caps = allCapsules;
    if (filter !== 'all') caps = caps.filter(c => c.status === filter);
    
    document.getElementById('listMeta').innerHTML = `Active Items: <strong>${caps.length}</strong>`;
    
    if (caps.length === 0) {
      list.innerHTML = `<div class="state-empty">No items found for this filter.</div>`;
      return;
    }

    list.innerHTML = caps.map(c => `
      <div class="cap-card" style="padding:15px; margin-bottom:10px; background:#fff; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.05);">
        <div style="font-weight:bold;">${c.title_en || 'Untitled'}</div>
        <div style="font-size:0.85rem; color:#666;">Status: ${c.status} | Category: ${c.category}</div>
      </div>
    `).join('');
  }

  function setFilter(f) {
    filter = f;
    document.querySelectorAll('.filter-pill').forEach(p => p.classList.toggle('active', p.dataset.f === f));
    render();
  }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'show';
    setTimeout(() => t.className = '', 3000);
  }
</script>
</body>
</html>
