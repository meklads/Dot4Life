# Coolify/Nixpacks — static Dot4Life site (HTML/CSS/JS at repo root).
# Only the public folder _site (built by scripts/build_public.mjs) is served,
# so internal docs and scripts in the repo are never exposed.
# Root package.json devDeps (puppeteer/jsdom) are for local QA scripts only.

[variables]
PUPPETEER_SKIP_DOWNLOAD = "true"
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "true"
NIXPACKS_PATH = "/app/node_modules/.bin"

[phases.install]
cmds = [
  "npm install --omit=dev --ignore-scripts",
  "node scripts/generate_static_routes.mjs",
  "node scripts/build_public.mjs"
]

[start]
cmd = "npx --yes serve _site -l ${PORT:-3000}"
