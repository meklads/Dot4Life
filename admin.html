<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Dot4Life — Capsule Admin</title>
<link rel="icon" href="/favicon.ico"/>
<style>
/* ═══════════════════════════════════════
   TOKENS
═══════════════════════════════════════ */
:root {
  --bg:        #F5F1EB;
  --surface:   #FFFFFF;
  --border:    #E8E0D5;
  --gold:      #B8861A;
  --gold-soft: rgba(184,134,26,.1);
  --text:      #2C2218;
  --muted:     #8A7F74;
  --faint:     #C8BFB5;

  --green:     #3A8A5F;
  --green-bg:  #EBF5EF;
  --red:       #B83232;
  --red-bg:    #FAEAEA;
  --amber:     #B87018;
  --amber-bg:  #FBF1E0;
  --blue:      #2060A0;
  --blue-bg:   #E8EFF8;
  --slate:     #607080;
  --slate-bg:  #EEF1F4;

  --r:   10px;
  --r-sm: 6px;
  --sh:  0 2px 16px rgba(44,34,24,.07);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  min-height: 100vh;
}

/* ═══════════════════════════════════════
   LOGIN
═══════════════════════════════════════ */
#view-login {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.login-wrap {
  width: 100%;
  max-width: 360px;
}

.login-mark {
  text-align: center;
  margin-bottom: 32px;
}
.login-mark .dot {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 52px; height: 52px;
  border-radius: 50%;
  background: var(--gold-soft);
  font-size: 1.5rem;
  margin-bottom: 12px;
}
.login-mark h1 {
  font-size: 1.15rem;
  font-weight: 700;
  letter-spacing: -.01em;
  color: var(--text);
}
.login-mark p {
  color: var(--muted);
  font-size: .82rem;
  margin-top: 3px;
}

.login-card {
  background: var(--surface);
  border-radius: 14px;
  box-shadow: var(--sh);
  padding: 28px 28px 24px;
}

.field { margin-bottom: 14px; }
.field label {
  display: block;
  font-size: .75rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  padding: 11px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: .9rem;
  color: var(--text);
  background: var(--surface);
  outline: none;
  transition: border-color .2s;
}
.field input:focus { border-color: var(--gold); }

.btn-login {
  width: 100%;
  padding: 12px;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  font-size: .9rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
  margin-top: 4px;
}
.btn-login:hover { opacity: .88; }
.btn-login:disabled { opacity: .5; cursor: not-allowed; }

.login-err {
  margin-top: 12px;
  padding: 9px 12px;
  background: var(--red-bg);
  color: var(--red);
  border-radius: var(--r-sm);
  font-size: .82rem;
  display: none;
}

/* ═══════════════════════════════════════
   APP
═══════════════════════════════════════ */
#view-app { display: none; min-height: 100vh; }

/* ── Header ── */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 50;
}
.topbar-brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 700;
  font-size: .95rem;
  color: var(--text);
}
.topbar-brand .dot2 {
  width: 28px; height: 28px;
  background: var(--gold-soft);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: .85rem;
}
.topbar-right {
  display: flex;
  align-items: center;
  gap: 14px;
}
.topbar-tag {
  font-size: .73rem;
  font-weight: 600;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .08em;
  background: var(--bg);
  padding: 3px 9px;
  border-radius: 20px;
}
.btn-signout {
  font-size: .8rem;
  color: var(--muted);
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px 0;
  transition: color .15s;
}
.btn-signout:hover { color: var(--red); }

/* ── Page body ── */
.page {
  max-width: 740px;
  margin: 0 auto;
  padding: 32px 24px 64px;
}

/* ── Filter bar ── */
.filter-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.filter-pill {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: .78rem;
  font-weight: 600;
  border: 1.5px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: all .15s;
  white-space: nowrap;
}
.filter-pill:hover { border-color: var(--gold); color: var(--gold); }
.filter-pill.active {
  background: var(--gold);
  border-color: var(--gold);
  color: #fff;
}
.filter-spacer { flex: 1; }
.btn-refresh {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  background: var(--surface);
  color: var(--muted);
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.btn-refresh:hover { border-color: var(--gold); color: var(--gold); }
.btn-refresh svg { width: 13px; height: 13px; }

/* ── Count ── */
.list-meta {
  font-size: .78rem;
  color: var(--muted);
  margin-bottom: 14px;
}
.list-meta strong { color: var(--text); }

/* ═══════════════════════════════════════
   CAPSULE CARD
═══════════════════════════════════════ */
.capsule-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.cap-card {
  background: var(--surface);
  border-radius: var(--r);
  box-shadow: var(--sh);
  overflow: hidden;
  transition: box-shadow .2s;
  border-left: 3px solid var(--border);
}
.cap-card:hover { box-shadow: 0 4px 24px rgba(44,34,24,.10); }

/* status stripe */
.cap-card[data-status="pending_review"] { border-left-color: var(--amber); }
.cap-card[data-status="approved"]       { border-left-color: var(--green); }
.cap-card[data-status="published"]      { border-left-color: var(--blue);  }
.cap-card[data-status="rejected"]       { border-left-color: var(--red);   }

/* card top row */
.cap-row {
  padding: 16px 18px 14px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: start;
  gap: 12px;
}

.cap-emoji {
  font-size: 1.6rem;
  line-height: 1;
  padding-top: 2px;
}

.cap-info { min-width: 0; }
.cap-title {
  font-size: .92rem;
  font-weight: 700;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 2px;
}
.cap-title-ar {
  font-size: .8rem;
  color: var(--muted);
  direction: rtl;
  text-align: right;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 6px;
}
.cap-pills {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  align-items: center;
}

/* status pill */
.pill {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 20px;
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .02em;
}
.pill-draft          { background: var(--slate-bg); color: var(--slate); }
.pill-pending_review { background: var(--amber-bg); color: var(--amber); }
.pill-approved       { background: var(--green-bg); color: var(--green); }
.pill-published      { background: var(--blue-bg);  color: var(--blue);  }
.pill-rejected       { background: var(--red-bg);   color: var(--red);   }

.pill-cat {
  background: var(--gold-soft);
  color: var(--gold);
  font-size: .68rem;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
}
.pill-date {
  font-size: .7rem;
  color: var(--faint);
}

/* card toggle */
.cap-toggle {
  width: 26px; height: 26px;
  border-radius: 50%;
  background: var(--bg);
  border: none;
  cursor: pointer;
  font-size: .75rem;
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  transition: background .15s;
  flex-shrink: 0;
  margin-top: 2px;
}
.cap-toggle:hover { background: var(--border); }

/* ── Action bar ── */
.cap-actions {
  padding: 0 18px 14px;
  display: flex;
  gap: 7px;
  flex-wrap: wrap;
}

.btn-act {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 12px;
  border-radius: var(--r-sm);
  font-size: .77rem;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid transparent;
  transition: all .15s;
}
.btn-approve {
  background: var(--green-bg);
  color: var(--green);
  border-color: rgba(58,138,95,.2);
}
.btn-approve:hover { background: var(--green); color: #fff; }

.btn-reject {
  background: var(--red-bg);
  color: var(--red);
  border-color: rgba(184,50,50,.15);
}
.btn-reject:hover { background: var(--red); color: #fff; }

.btn-publish {
  background: var(--blue-bg);
  color: var(--blue);
  border-color: rgba(32,96,160,.15);
}
.btn-publish:hover { background: var(--blue); color: #fff; }

.btn-edit-open {
  background: var(--bg);
  color: var(--muted);
  border-color: var(--border);
}
.btn-edit-open:hover { border-color: var(--gold); color: var(--gold); }

.btn-submit {
  background: var(--amber-bg);
  color: var(--amber);
  border-color: rgba(184,112,24,.15);
}
.btn-submit:hover { background: var(--amber); color: #fff; }

/* ── Edit panel ── */
.cap-edit {
  display: none;
  border-top: 1px solid var(--border);
  padding: 18px;
  background: #FDFCFA;
}
.cap-edit.open { display: block; }

.edit-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-bottom: 12px;
}
.edit-grid-1 { grid-column: 1/-1; }

.ef-label {
  display: block;
  font-size: .7rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 4px;
}
.ef-input, .ef-select, .ef-textarea {
  width: 100%;
  padding: 8px 10px;
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: .85rem;
  color: var(--text);
  background: var(--surface);
  outline: none;
  font-family: inherit;
  transition: border-color .15s;
}
.ef-input:focus, .ef-select:focus, .ef-textarea:focus { border-color: var(--gold); }
.ef-textarea { resize: vertical; min-height: 70px; }

.edit-footer {
  display: flex;
  gap: 8px;
  margin-top: 4px;
}
.btn-save {
  padding: 7px 16px;
  background: var(--gold);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-save:hover { opacity: .85; }
.btn-cancel {
  padding: 7px 12px;
  background: transparent;
  color: var(--muted);
  border: 1.5px solid var(--border);
  border-radius: var(--r-sm);
  font-size: .8rem;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
}
.btn-cancel:hover { border-color: var(--red); color: var(--red); }

/* ── Publish date row ── */
.publish-row {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 10px 18px 14px;
  border-top: 1px solid var(--border);
  background: var(--blue-bg);
}
.publish-row.open { display: flex; }
.publish-row label { font-size: .78rem; font-weight: 600; color: var(--blue); white-space: nowrap; }
.publish-row input {
  padding: 5px 9px;
  border: 1.5px solid rgba(32,96,160,.3);
  border-radius: var(--r-sm);
  font-size: .82rem;
  background: #fff;
  color: var(--text);
  outline: none;
}
.btn-pub-confirm {
  padding: 5px 14px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-pub-confirm:hover { opacity: .85; }

/* ── Reject reason row ── */
.reject-row {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 10px 18px 14px;
  border-top: 1px solid var(--border);
  background: var(--red-bg);
  flex-wrap: wrap;
}
.reject-row.open { display: flex; }
.reject-row label { font-size: .78rem; font-weight: 600; color: var(--red); white-space: nowrap; }
.reject-row select {
  padding: 5px 9px;
  border: 1.5px solid rgba(184,50,50,.2);
  border-radius: var(--r-sm);
  font-size: .82rem;
  background: #fff;
  color: var(--text);
  outline: none;
  flex: 1; min-width: 160px;
}
.btn-rej-confirm {
  padding: 5px 14px;
  background: var(--red);
  color: #fff;
  border: none;
  border-radius: var(--r-sm);
  font-size: .78rem;
  font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.btn-rej-confirm:hover { opacity: .85; }
.btn-rej-cancel {
  padding: 5px 10px;
  background: transparent;
  color: var(--muted);
  border: none;
  font-size: .78rem;
  cursor: pointer;
}

/* ═══════════════════════════════════════
   EMPTY / LOADING
═══════════════════════════════════════ */
.state-empty {
  text-align: center;
  padding: 64px 24px;
  color: var(--muted);
}
.state-empty .ico { font-size: 2rem; margin-bottom: 10px; }
.state-empty .ttl { font-weight: 600; color: var(--text); margin-bottom: 4px; }
.state-empty .sub { font-size: .83rem; }

.state-loading {
  text-align: center;
  padding: 48px;
  color: var(--muted);
  font-size: .85rem;
}

/* ═══════════════════════════════════════
   TOAST
═══════════════════════════════════════ */
#toast {
  position: fixed;
  bottom: 28px;
  right: 28px;
  z-index: 999;
  padding: 11px 18px;
  border-radius: 8px;
  font-size: .83rem;
  font-weight: 600;
  box-shadow: 0 4px 20px rgba(0,0,0,.14);
  transform: translateY(60px);
  opacity: 0;
  transition: all .22s cubic-bezier(.34,1.56,.64,1);
  pointer-events: none;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.ok  { background: var(--green); color: #fff; }
#toast.err { background: var(--red);   color: #fff; }
#toast.inf { background: #333;         color: #fff; }

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */
@media (max-width: 580px) {
  .edit-grid { grid-template-columns: 1fr; }
  .page { padding: 20px 16px 56px; }
  .cap-row { grid-template-columns: auto 1fr; }
  .cap-toggle { display: none; }
}
</style>
</head>
<body>

<!-- ════════════════════════════
     LOGIN
════════════════════════════ -->
<div id="view-login">
  <div class="login-wrap">
    <div class="login-mark">
      <div class="dot">🧘</div>
      <h1>Dot4Life Admin</h1>
      <p>Capsule Engine Control</p>
    </div>
    <div class="login-card">
      <div class="field">
        <label>Password</label>
        <input type="password" id="pw" placeholder="Enter admin password" autocomplete="current-password"/>
      </div>
      <button class="btn-login" id="loginBtn" onclick="login()">Sign In</button>
      <div class="login-err" id="loginErr"></div>
    </div>
  </div>
</div>

<!-- ════════════════════════════
     APP
════════════════════════════ -->
<div id="view-app">

  <!-- header -->
  <div class="topbar">
    <div class="topbar-brand">
      <div class="dot2">🧘</div>
      Dot4Life
    </div>
    <div class="topbar-right">
      <span class="topbar-tag">Capsule Admin</span>
      <button class="btn-signout" onclick="signout()">Sign out</button>
    </div>
  </div>

  <!-- page -->
  <div class="page">

    <!-- filter bar -->
    <div class="filter-bar">
      <button class="filter-pill active" data-f="all"            onclick="setFilter('all')">All</button>
      <button class="filter-pill"        data-f="pending_review" onclick="setFilter('pending_review')">Pending Review</button>
      <button class="filter-pill"        data-f="approved"       onclick="setFilter('approved')">Approved</button>
      <button class="filter-pill"        data-f="published"      onclick="setFilter('published')">Published</button>
      <button class="filter-pill"        data-f="rejected"       onclick="setFilter('rejected')">Rejected</button>
      <button class="filter-pill"        data-f="draft"          onclick="setFilter('draft')">Draft</button>
      <div class="filter-spacer"></div>
      <button class="btn-refresh" onclick="load()">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M13.5 2.5A6.5 6.5 0 1 1 4 3.5"/>
          <polyline points="1 1 4 4 4 1"/>
        </svg>
        Refresh
      </button>
    </div>

    <div class="list-meta" id="listMeta"></div>
    <div class="capsule-list" id="capsuleList">
      <div class="state-loading">Loading capsules…</div>
    </div>

  </div>
</div>

<!-- toast -->
<div id="toast"></div>

<script>
// ═══════════════════════════════════════
//  CONFIG
// ═══════════════════════════════════════
const API = 'http://localhost:3030/api';
let token  = sessionStorage.getItem('d4l_token') || '';
let filter = 'all';
let allCapsules = [];

const CAT_LABELS = {
  meals:   '🍽 Meals',
  family:  '👨‍👩‍👧 Family',
  wellness:'🌿 Wellness',
  faith:   '☪️ Faith',
  money:   '💰 Money',
  living:  '🏠 Living',
};

const STATUS_LABELS = {
  draft:          'Draft',
  pending_review: 'Pending Review',
  approved:       'Approved',
  published:      'Published',
  rejected:       'Rejected',
};

// ═══════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });
  if (token) checkAndShow();
  else show('login');
});

async function checkAndShow() {
  const r = await call('GET', '/admin/me');
  if (r.ok) { show('app'); load(); }
  else { token = ''; show('login'); }
}

// ═══════════════════════════════════════
//  AUTH
// ═══════════════════════════════════════
async function login() {
  const pw  = document.getElementById('pw').value.trim();
  const btn = document.getElementById('loginBtn');
  const err = document.getElementById('loginErr');
  if (!pw) return;

  btn.disabled = true;
  btn.textContent = '…';
  err.style.display = 'none';

  const r = await call('POST', '/admin/login', { password: pw });

  btn.disabled = false;
  btn.textContent = 'Sign In';

  if (r.ok && r.data.token) {
    token = r.data.token;
    sessionStorage.setItem('d4l_token', token);
    show('app');
    load();
  } else {
    err.textContent = r.data?.error === 'Invalid password'
      ? 'Incorrect password.'
      : 'Cannot reach server. Is capsule-engine running on port 3030?';
    err.style.display = 'block';
  }
}

function signout() {
  call('POST', '/admin/logout').catch(() => {});
  token = '';
  sessionStorage.removeItem('d4l_token');
  allCapsules = [];
  show('login');
}

// ═══════════════════════════════════════
//  DATA
// ═══════════════════════════════════════
async function load() {
  const list = document.getElementById('capsuleList');
  list.innerHTML = '<div class="state-loading">Loading…</div>';

  const path = filter === 'all'
    ? '/admin/capsules'
    : `/admin/capsules?status=${filter}`;

  const r = await call('GET', path);

  if (!r.ok) {
    list.innerHTML = `<div class="state-empty"><div class="ico">⚠️</div><div class="ttl">Could not load</div><div class="sub">${r.data?.error || 'Check server'}</div></div>`;
    return;
  }

  allCapsules = r.data.capsules || [];
  render(allCapsules);
}

function render(caps) {
  const list = document.getElementById('capsuleList');
  const meta = document.getElementById('listMeta');

  meta.innerHTML = `Showing <strong>${caps.length}</strong> capsule${caps.length !== 1 ? 's' : ''}`;

  if (!caps.length) {
    list.innerHTML = `<div class="state-empty">
      <div class="ico">${filter === 'pending_review' ? '✅' : '📭'}</div>
      <div class="ttl">${filter === 'pending_review' ? 'Queue is clear' : 'Nothing here'}</div>
      <div class="sub">${filter === 'pending_review' ? 'No capsules waiting for review.' : 'Try a different filter.'}</div>
    </div>`;
    return;
  }

  list.innerHTML = caps.map(c => capsuleCard(c)).join('');
}

// ═══════════════════════════════════════
//  CARD RENDER
// ═══════════════════════════════════════
function capsuleCard(c) {
  const statusLabel = STATUS_LABELS[c.status] || c.status;
  const catLabel    = CAT_LABELS[c.category]  || c.category;

  // Which action buttons to show
  const actions = [];
  if (c.status === 'draft')           actions.push('submit', 'edit');
  if (c.status === 'pending_review')  actions.push('approve', 'reject', 'edit');
  if (c.status === 'approved')        actions.push('publish', 'reject', 'edit');
  if (c.status === 'rejected')        actions.push('edit', 'submit');
  if (c.status === 'published')       actions.push('edit');

  const actionBtns = actions.map(a => {
    if (a === 'approve') return `<button class="btn-act btn-approve" onclick="approve('${c.id}')">✓ Approve</button>`;
    if (a === 'reject')  return `<button class="btn-act btn-reject"  onclick="toggleReject('${c.id}')">✗ Reject</button>`;
    if (a === 'edit')    return `<button class="btn-act btn-edit-open" onclick="toggleEdit('${c.id}')">✎ Edit</button>`;
    if (a === 'publish') return `<button class="btn-act btn-publish" onclick="togglePublish('${c.id}', '${c.scheduled_date||''}')">🚀 Publish</button>`;
    if (a === 'submit')  return `<button class="btn-act btn-submit"  onclick="submit('${c.id}')">↑ Submit for Review</button>`;
  }).join('');

  const todayStr = new Date().toISOString().slice(0, 10);

  return `
<div class="cap-card" id="card-${c.id}" data-status="${c.status}">
  <div class="cap-row">
    <div class="cap-emoji">${c.emoji || '🌿'}</div>
    <div class="cap-info">
      <div class="cap-title">${esc(c.title_en)}</div>
      ${c.title_ar ? `<div class="cap-title-ar">${esc(c.title_ar)}</div>` : ''}
      <div class="cap-pills">
        <span class="pill pill-${c.status}">${statusLabel}</span>
        <span class="pill-cat">${catLabel}</span>
        ${c.scheduled_date ? `<span class="pill-date">📅 ${c.scheduled_date}${c.scheduled_date === todayStr ? ' · today' : ''}</span>` : ''}
        ${c.reject_reason  ? `<span class="pill-date" style="color:var(--red)">✗ ${esc(c.reject_reason)}</span>` : ''}
      </div>
    </div>
    <button class="cap-toggle" onclick="toggleBody('${c.id}')" title="Show content">▾</button>
  </div>

  <!-- body preview -->
  <div id="body-${c.id}" style="display:none; padding:0 18px 14px; color:var(--muted); font-size:.83rem; line-height:1.7">
    ${c.body_en  ? `<p style="margin-bottom:6px">${esc(c.body_en)}</p>` : ''}
    ${c.body_ar  ? `<p style="direction:rtl;text-align:right;color:var(--faint)">${esc(c.body_ar)}</p>` : ''}
    ${c.tip_en   ? `<p style="margin-top:8px;color:var(--gold);font-size:.8rem">💡 ${esc(c.tip_en)}</p>` : ''}
  </div>

  <!-- actions -->
  ${actionBtns ? `<div class="cap-actions">${actionBtns}</div>` : ''}

  <!-- publish date picker (hidden by default) -->
  <div class="publish-row" id="pub-${c.id}">
    <label>Publish date:</label>
    <input type="date" id="pub-date-${c.id}" value="${c.scheduled_date || todayStr}"/>
    <button class="btn-pub-confirm" onclick="confirmPublish('${c.id}')">Confirm</button>
    <button class="btn-rej-cancel" onclick="togglePublish('${c.id}')">Cancel</button>
  </div>

  <!-- reject reason (hidden by default) -->
  <div class="reject-row" id="rej-${c.id}">
    <label>Reason:</label>
    <select id="rej-reason-${c.id}">
      <option value="content-quality">Content quality needs improvement</option>
      <option value="wrong-category">Wrong category</option>
      <option value="translation-issue">Translation issue</option>
      <option value="duplicate">Duplicate content</option>
      <option value="not-aligned">Not aligned with tone</option>
      <option value="other">Other</option>
    </select>
    <button class="btn-rej-confirm" onclick="confirmReject('${c.id}')">Reject</button>
    <button class="btn-rej-cancel" onclick="toggleReject('${c.id}')">Cancel</button>
  </div>

  <!-- inline edit panel -->
  <div class="cap-edit" id="edit-${c.id}">
    <div class="edit-grid">
      <div>
        <label class="ef-label">Category</label>
        <select class="ef-select" id="e-cat-${c.id}">
          <option value="meals"   ${c.category==='meals'?'selected':''}>🍽 Meals</option>
          <option value="family"  ${c.category==='family'?'selected':''}>👨‍👩‍👧 Family</option>
          <option value="wellness"${c.category==='wellness'?'selected':''}>🌿 Wellness</option>
          <option value="faith"   ${c.category==='faith'?'selected':''}>☪️ Faith</option>
          <option value="money"   ${c.category==='money'?'selected':''}>💰 Money</option>
          <option value="living"  ${c.category==='living'?'selected':''}>🏠 Living</option>
        </select>
      </div>
      <div style="display:grid;grid-template-columns:60px 1fr;gap:8px">
        <div>
          <label class="ef-label">Emoji</label>
          <input class="ef-input" id="e-emoji-${c.id}" value="${esc(c.emoji||'🌿')}" maxlength="4"/>
        </div>
        <div>
          <label class="ef-label">Date</label>
          <input class="ef-input" id="e-date-${c.id}" type="date" value="${c.scheduled_date||''}"/>
        </div>
      </div>
      <div>
        <label class="ef-label">Title (English)</label>
        <input class="ef-input" id="e-ten-${c.id}" value="${esc(c.title_en)}"/>
      </div>
      <div>
        <label class="ef-label">Title (Arabic)</label>
        <input class="ef-input" id="e-tar-${c.id}" value="${esc(c.title_ar||'')}" dir="rtl"/>
      </div>
      <div>
        <label class="ef-label">Subtitle (English)</label>
        <input class="ef-input" id="e-sen-${c.id}" value="${esc(c.subtitle_en||'')}"/>
      </div>
      <div>
        <label class="ef-label">Subtitle (Arabic)</label>
        <input class="ef-input" id="e-sar-${c.id}" value="${esc(c.subtitle_ar||'')}" dir="rtl"/>
      </div>
      <div class="edit-grid-1">
        <label class="ef-label">Body (English)</label>
        <textarea class="ef-textarea" id="e-ben-${c.id}">${esc(c.body_en||'')}</textarea>
      </div>
      <div class="edit-grid-1">
        <label class="ef-label">Body (Arabic)</label>
        <textarea class="ef-textarea" id="e-bar-${c.id}" dir="rtl">${esc(c.body_ar||'')}</textarea>
      </div>
      <div>
        <label class="ef-label">Tip (English)</label>
        <input class="ef-input" id="e-ten2-${c.id}" value="${esc(c.tip_en||'')}"/>
      </div>
      <div>
        <label class="ef-label">Tip (Arabic)</label>
        <input class="ef-input" id="e-tar2-${c.id}" value="${esc(c.tip_ar||'')}" dir="rtl"/>
      </div>
    </div>
    <div class="edit-footer">
      <button class="btn-save" onclick="saveEdit('${c.id}')">Save</button>
      <button class="btn-cancel" onclick="toggleEdit('${c.id}')">Cancel</button>
    </div>
  </div>

</div>`;
}

// ═══════════════════════════════════════
//  TOGGLE HELPERS
// ═══════════════════════════════════════
function toggleBody(id) {
  const el = document.getElementById(`body-${id}`);
  el.style.display = el.style.display === 'block' ? 'none' : 'block';
}
function toggleEdit(id) {
  const el = document.getElementById(`edit-${id}`);
  el.classList.toggle('open');
  closeOtherRows(id);
}
function togglePublish(id, date) {
  const el = document.getElementById(`pub-${id}`);
  el.classList.toggle('open');
  if (el.classList.contains('open') && date) {
    document.getElementById(`pub-date-${id}`).value = date || new Date().toISOString().slice(0,10);
  }
  closeOtherRows(id, 'pub');
}
function toggleReject(id) {
  const el = document.getElementById(`rej-${id}`);
  el.classList.toggle('open');
  closeOtherRows(id, 'rej');
}
function closeOtherRows(keepId, keepType) {
  if (keepType !== 'pub') document.querySelectorAll('.publish-row.open').forEach(el => { if (!el.id.endsWith(keepId)) el.classList.remove('open'); });
  if (keepType !== 'rej') document.querySelectorAll('.reject-row.open').forEach(el  => { if (!el.id.endsWith(keepId)) el.classList.remove('open'); });
}

// ═══════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════
async function approve(id) {
  const r = await call('POST', `/admin/capsules/${id}/approve`);
  if (r.ok) { toast('Approved ✓', 'ok'); load(); }
  else toast(r.data?.error || 'Failed', 'err');
}

async function submit(id) {
  const r = await call('POST', `/admin/capsules/${id}/submit`);
  if (r.ok) { toast('Submitted for review', 'inf'); load(); }
  else toast(r.data?.error || 'Failed', 'err');
}

async function confirmReject(id) {
  const reason = document.getElementById(`rej-reason-${id}`).value;
  const r = await call('POST', `/admin/capsules/${id}/reject`, { reason });
  if (r.ok) { toast('Rejected', 'err'); load(); }
  else toast(r.data?.error || 'Failed', 'err');
}

async function confirmPublish(id) {
  const date = document.getElementById(`pub-date-${id}`).value;
  if (!date) return toast('Pick a date', 'err');
  const r = await call('POST', `/admin/capsules/${id}/publish`, { date });
  if (r.ok) { toast('Published 🚀', 'ok'); load(); }
  else toast(r.data?.error || 'Failed', 'err');
}

async function saveEdit(id) {
  const body = {
    category:       document.getElementById(`e-cat-${id}`).value,
    emoji:          document.getElementById(`e-emoji-${id}`).value,
    scheduled_date: document.getElementById(`e-date-${id}`).value,
    title_en:       document.getElementById(`e-ten-${id}`).value,
    title_ar:       document.getElementById(`e-tar-${id}`).value,
    subtitle_en:    document.getElementById(`e-sen-${id}`).value,
    subtitle_ar:    document.getElementById(`e-sar-${id}`).value,
    body_en:        document.getElementById(`e-ben-${id}`).value,
    body_ar:        document.getElementById(`e-bar-${id}`).value,
    tip_en:         document.getElementById(`e-ten2-${id}`).value,
    tip_ar:         document.getElementById(`e-tar2-${id}`).value,
  };
  const r = await call('PUT', `/admin/capsules/${id}`, body);
  if (r.ok) { toast('Saved ✓', 'ok'); load(); }
  else toast(r.data?.error || 'Save failed', 'err');
}

// ═══════════════════════════════════════
//  FILTER
// ═══════════════════════════════════════
function setFilter(f) {
  filter = f;
  document.querySelectorAll('.filter-pill').forEach(p => {
    p.classList.toggle('active', p.dataset.f === f);
  });
  load();
}

// ═══════════════════════════════════════
//  API HELPER
// ═══════════════════════════════════════
async function call(method, path, body) {
  try {
    const r = await fetch(`${API}${path}`, {
      method,
      headers: {
        'Content-Type':  'application/json',
        'Authorization': `Bearer ${token}`,
      },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json();
    return { ok: r.ok, status: r.status, data };
  } catch {
    return { ok: false, status: 0, data: { error: 'Network error — is the server running?' } };
  }
}

// ═══════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════
function show(view) {
  document.getElementById('view-login').style.display = view === 'login' ? 'flex'  : 'none';
  document.getElementById('view-app').style.display   = view === 'app'   ? 'block' : 'none';
}

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

let _toastT;
function toast(msg, type = 'inf') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = `show ${type}`;
  clearTimeout(_toastT);
  _toastT = setTimeout(() => el.className = '', 3000);
}
</script>
