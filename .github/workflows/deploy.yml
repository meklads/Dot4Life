name: 🚀 Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🚀 Deploy via appleboy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/dotforlife
            git init
            git remote add origin git@github.com:meklads/Dot4Life.git 2>/dev/null || git remote set-url origin git@github.com:meklads/Dot4Life.git
            git fetch --depth=1 origin main
            git reset --hard origin/main
            chown -R www-data:www-data /var/www/dotforlife 2>/dev/null || true
            chmod -R 755 /var/www/dotforlife
            echo "✅ Deployment complete: $(date)"
