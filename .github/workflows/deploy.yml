name: 🚀 Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 📦 Copy files via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avz --delete --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='capsule-engine/node_modules' --exclude='capsule-engine/.env' --exclude='*.db' --exclude='*.db-shm' --exclude='*.db-wal' --exclude='.DS_Store' --exclude='Thumbs.db' --exclude='*.docx' --exclude='*.xlsx'
          path: ./
          remote_path: /var/www/dotforlife/
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}

      - name: 🔄 Set permissions
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            chown -R www-data:www-data /var/www/dotforlife 2>/dev/null || true
            chmod -R 755 /var/www/dotforlife
            echo "✅ Deployment complete: $(date)"
