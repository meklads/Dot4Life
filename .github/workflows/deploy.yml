name: 🚀 Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repo
        uses: actions/checkout@v4

      - name: 🔐 Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: 📦 Sync files to VPS via rsync
        run: |
          rsync -avz --delete \
            --rsh="ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519" \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            --exclude 'capsule-engine/node_modules' \
            --exclude 'capsule-engine/.env' \
            --exclude '*.db' \
            --exclude '*.db-shm' \
            --exclude '*.db-wal' \
            --exclude '.DS_Store' \
            --exclude 'Thumbs.db' \
            --exclude '*.docx' \
            --exclude '*.xlsx' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/dotforlife/

      - name: 🔄 Set permissions
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_ed25519 \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} \
            "chown -R www-data:www-data /var/www/dotforlife 2>/dev/null || true; chmod -R 755 /var/www/dotforlife; echo '✅ Deployment complete'"
