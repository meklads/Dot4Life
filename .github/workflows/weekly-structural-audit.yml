# تدقيق بنيوي أسبوعي — يفحص كل مقالات الموقع (لا المتغيّر فقط) بحثاً عن سايدبار مكسور.
# طبقة أمان دورية مجانية فوق بوابة CI اللحظية. تُنبّه وتسجّل في TEAM-BUS عند أي عطل.
name: Weekly Structural Audit

on:
  schedule:
    - cron: "0 6 * * 1"   # كل اثنين 6:00 صباحاً UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser
        run: pip install html5lib

      - name: Run full-site structural audit
        id: audit
        run: python3 scripts/structural_audit.py
        continue-on-error: true

      - name: Commit TEAM-BUS alert (if any broken found)
        run: |
          git config user.name "structural-audit-bot"
          git config user.email "structural-audit-bot@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "audit: تنبيه بنيوي أسبوعي — سايدبار مكسور مسجّل في TEAM-BUS"
            git push origin HEAD:main
          else
            echo "لا مكسور — لا تنبيه."
          fi

      - name: Fail if broken articles found
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::التدقيق الأسبوعي وجد مقالاً مكسوراً بنيوياً — راجع TEAM-BUS.md"
          exit 1
