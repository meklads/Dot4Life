// ═══════════════════════════════════════
// RENDER
// ═══════════════════════════════════════
(function(){
  var params = new URLSearchParams(window.location.search);
  var id = params.get('g') || 'quick-dinner';
  var g = GUIDES[id];
  var isAr = document.documentElement.getAttribute('data-lang') === 'ar';

  if (!g) {
    document.getElementById('guide-hero').style.display = 'none';
    document.getElementById('page').style.display = 'none';
    document.getElementById('guide-not-found').style.display = 'block';
    return;
  }

  function t(en, ar) { return isAr ? ar : en; }

  // Hero
  document.getElementById('hero-cat-link').innerHTML =
    '<a href="/library.html' + g.catHash + '">' + t(g.catEn, g.catAr) + '</a>';
  document.getElementById('hero-tag').textContent = t(g.tagEn, g.tagAr);
  document.getElementById('hero-title').textContent = t(g.titleEn, g.titleAr);
  document.getElementById('hero-emotion').textContent = t(g.emotionEn, g.emotionAr);
  document.getElementById('hero-emoji').textContent = g.emoji;

  // Update page title
  document.title = t(g.titleEn, g.titleAr) + ' — DOTFORLIFE';

  // Build main content
  var html = '';

  // Ingredients (if any)
  if (g.ingredients && g.ingredients.length) {
    html += '<div class="guide-block">';
    html += '<div class="guide-block-label">' + t('Ingredients','المقادير') + '</div>';
    html += '<div class="guide-ingredients">';
    g.ingredients.forEach(function(ing) {
      html += '<div class="guide-ing">' + t(ing.en, ing.ar) + '</div>';
    });
    html += '</div></div>';
  }

  // Steps
  if (g.steps && g.steps.length) {
    html += '<div class="guide-block">';
    html += '<div class="guide-block-label">' + t('Steps','الخطوات') + '</div>';
    html += '<div class="guide-steps">';
    g.steps.forEach(function(step, i) {
      html += '<div class="guide-step">';
      html += '<span class="guide-step-num">' + (i+1) + '</span>';
      html += '<span class="guide-step-text">' + t(step.en, step.ar) + '</span>';
      html += '</div>';
    });
    html += '</div></div>';
  }

  // Why it matters
  html += '<div class="guide-why">';
  html += '<div class="guide-why-label">' + t('Why this matters','لماذا يهمّ هذا') + '</div>';
  html += '<p class="guide-why-text">' + t(g.whyEn, g.whyAr) + '</p>';
  html += '</div>';

  // Actions
  html += '<div class="guide-actions">';
  html += '<button class="guide-btn guide-btn-save" id="guide-save">' + t('💾 Save','💾 حفظ') + '</button>';
  html += '<button class="guide-btn guide-btn-plan" id="guide-plan">' + t('🌙 Tonight','🌙 الليلة') + '</button>';
  html += '<a href="/library.html' + g.catHash + '" class="guide-btn guide-btn-lib">' + t('← Library','← المكتبة') + '</a>';
  html += '</div>';

  document.getElementById('guide-main').innerHTML = html;

  // Panel facts
  var factsHtml = '<div class="panel-card-title">' + t('About this guide','عن هذا الدليل') + '</div>';
  factsHtml += '<div class="panel-facts">';
  (g.facts || []).forEach(function(f) {
    factsHtml += '<div class="panel-fact"><span class="panel-fact-icon">' + f.icon + '</span>' + t(f.en, f.ar) + '</div>';
  });
  factsHtml += '</div>';
  document.getElementById('panel-facts-card').innerHTML = factsHtml;

  // Panel more (3 other guides from same category)
  var others = Object.keys(GUIDES).filter(function(k){ return k !== id && GUIDES[k].cat === g.cat; }).slice(0,3);
  var moreHtml = '';
  others.forEach(function(k) {
    var og = GUIDES[k];
    moreHtml += '<a href="/life-guide.html?g=' + k + '" class="panel-cat-link">';
    moreHtml += '<span>' + og.emoji + ' ' + t(og.titleEn, og.titleAr) + '</span>';
    moreHtml += '<span class="panel-cat-link-arrow">→</span></a>';
  });
  if (!moreHtml) {
    moreHtml = '<a href="/library.html" class="panel-cat-link"><span>' + t('Browse all guides','تصفّح كل الأدلة') + '</span><span class="panel-cat-link-arrow">→</span></a>';
  }
  document.getElementById('panel-more').innerHTML = moreHtml;

  // Save button
  document.getElementById('guide-save').addEventListener('click', function(){
    var key = 'dfl-saved-guides';
    var saved = JSON.parse(localStorage.getItem(key)||'[]');
    var entry = {id:id, title:t(g.titleEn,g.titleAr), emoji:g.emoji, date:Date.now()};
    if (!saved.find(function(s){return s.id===id;})) { saved.unshift(entry); localStorage.setItem(key,JSON.stringify(saved)); }
    this.innerHTML = t('✅ Saved!','✅ تم الحفظ');
    this.style.cssText = 'background:rgba(27,122,78,.12);color:#1B7A4E;border-color:#1B7A4E';
  });

  document.getElementById('guide-plan').addEventListener('click', function(){
    this.innerHTML = t('✅ Added!','✅ أُضيف');
    this.style.cssText = 'background:rgba(27,122,78,.12);color:#1B7A4E;border-color:#1B7A4E';
  });

})();

// Nav handlers
(function(){
  var nb = document.getElementById('navbar');
  window.addEventListener('scroll', function(){ nb && nb.classList.toggle('scrolled', window.scrollY > 40); }, {passive:true});

  var langBtn = document.getElementById('lang-toggle');
  langBtn && langBtn.addEventListener('click', function(){
    var h = document.documentElement;
    var l = h.getAttribute('data-lang') === 'ar' ? 'en' : 'ar';
    h.setAttribute('data-lang', l);
    h.setAttribute('lang', l);
    h.setAttribute('dir', l==='ar'?'rtl':'ltr');
    localStorage.setItem('dfl-lang', l);
    // Re-render guide in new language
    window.location.reload();
  });

  var themeBtn = document.getElementById('theme-toggle');
  themeBtn && themeBtn.addEventListener('click', function(){
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    localStorage.setItem('dfl-theme', t);
  });
})();
</script>
